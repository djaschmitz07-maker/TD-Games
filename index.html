                        statusText.innerText = "Crafting Table opened.";
                    }
                }
            }
        });


        closeCraftBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            craftingMenuScreen.style.display = 'none';
        });

        craftingRecipesContainer.addEventListener('pointerdown', (e) => {
            const recipeEl = e.target.closest('.craft-recipe');
            if (recipeEl) {
                e.stopPropagation();
                const recipeType = recipeEl.dataset.recipe;
                craftItem(recipeType);
            }
        });

        function updateCraftingRecipeAvailability() {
            const recipes = craftingRecipesContainer.querySelectorAll('.craft-recipe');
            recipes.forEach(recipeEl => {
                const recipeType = recipeEl.dataset.recipe;
                const recipe = CRAFTING_RECIPES[recipeType];
                let canCraft = true;

                // Check crafting location requirement
                const nearestCraftingTable = findNearestCraftingTable();
                const isNearCraftingTable = nearestCraftingTable && getDistance(player, nearestCraftingTable) < TILE_SIZE * 1.5;

                if (recipe.location === 'crafting_table' && !isNearCraftingTable) {
                    canCraft = false;
                }

                recipe.cost.forEach(costItem => {
                    const hasItem = getItemCount(costItem.type);
                    const costSpan = recipeEl.querySelector(`[data-cost-item="${costItem.type}"]`);
                    if (hasItem < costItem.count) {
                        canCraft = false;
                        if (costSpan) costSpan.classList.add('insufficient');
                    } else {
                        if (costSpan) costSpan.classList.remove('insufficient');
                    }
                });

                recipeEl.style.opacity = canCraft ? '1' : '0.5';
                recipeEl.style.pointerEvents = canCraft ? 'auto' : 'none';
            });
        }

        function craftItem(recipeType) {
            const recipe = CRAFTING_RECIPES[recipeType];
            if (!recipe) return;

            let canCraft = true;
            recipe.cost.forEach(costItem => {
                if (getItemCount(costItem.type) < costItem.count) {
                    canCraft = false;
                }
            });

            // Check crafting location requirement again
            const nearestCraftingTable = findNearestCraftingTable();
            const isNearCraftingTable = nearestCraftingTable && getDistance(player, nearestCraftingTable) < TILE_SIZE * 1.5;
            if (recipe.location === 'crafting_table' && !isNearCraftingTable) {
                canCraft = false;
                statusText.innerText = `Must be near a Crafting Table to craft ${recipe.output.type}.`;
            }

            if (canCraft) {
                recipe.cost.forEach(costItem => {
                    removeItemFromInventory(costItem.type, costItem.count);
                });
                
                if (recipe.output.type === 'wood_plank' || recipe.output.type === 'crafting_table') {
                    // For buildable items, enter build mode
                    enterBuildMode(recipe.output.type);
                    statusText.innerText = `Crafted ${recipe.output.type}! Now place it.`;
                    craftingMenuScreen.style.display = 'none'; // Close crafting menu
                } else {
                    // Other items go to inventory/hotbar
                    addItemToInventory(recipe.output.type, recipe.output.count);
                    statusText.innerText = `Crafted ${recipe.output.count} ${recipe.output.type}!`;
                }
                
                renderInventorySlots();
                renderHotbarUI(); // In case hotbar items were used
                updateCraftingRecipeAvailability(); // Update availability after crafting
            } else {
                statusText.innerText = `Not enough resources to craft ${recipeType}.`;
            }
        }

        // Continuous Blueprint Construction Loop System
        confirmBuildBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (!buildMode.active || !buildMode.isValidPlacement || !buildMode.hasEnoughResources) {
                statusText.innerText = "Cannot build here or not enough resources!";
                return;
            }
            
            // Build the current item permanently into dictionary map storage
            raftGrid[getGridKey(buildMode.gridX, buildMode.gridY)] = { type: buildMode.buildItemType, walkable: buildMode.buildItemType === 'raft_piece' };
            
            // Deduct resources
            const recipe = CRAFTING_RECIPES[buildMode.buildItemType];
            if (recipe) {
                recipe.cost.forEach(costItem => {
                    removeItemFromInventory(costItem.type, costItem.count);
                });
            } else if (buildMode.buildItemType === 'raft_piece') { // Default cost for raft piece if not a crafted item
                removeItemFromInventory("wood", 2); 
            }
            
            renderInventorySlots();
            renderHotbarUI(); // In case hotbar items were used

            if (buildMode.buildItemType === 'raft_piece') {
                // Automatically find and jump preview tile to an adjacent open coordinate slot
                let adjacents = [
                    {x: buildMode.gridX + 1, y: buildMode.gridY},
                    {x: buildMode.gridX - 1, y: buildMode.gridY},
                    {x: buildMode.gridX, y: buildMode.gridY + 1},
                    {x: buildMode.gridX, y: buildMode.gridY - 1}
                ];

                let foundNextSpot = false;
                for (let i = 0; i < adjacents.length; i++) {
                    let key = getGridKey(adjacents[i].x, adjacents[i].y);
                    if (!raftGrid[key]) { // Spot is completely vacant and free
                        buildMode.gridX = adjacents[i].x;
                        buildMode.gridY = adjacents[i].y;
                        foundNextSpot = true;
                        break;
                    }
                }
                if (!foundNextSpot) {
                    // If no adjacent spot found, exit build mode or pick a default
                    exitBuildMode();
                    statusText.innerText = "No more adjacent spots to build. Exiting build mode.";
                } else {
                    statusText.innerText = "Raft Piece Built! Continuous build loop active...";
                }
            } else {
                // For other items like crafting table, exit build mode after placing one
                exitBuildMode();
                statusText.innerText = `${buildMode.buildItemType} placed!`;
            }
        });

        cancelBuildBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            exitBuildMode();
        });

        function enterBuildMode(itemType) {
            buildMode.active = true;
            buildMode.buildItemType = itemType;
            buildOverlay.style.display = 'flex';
            buildMode.touchX = canvas.width / 2;
            buildMode.touchY = canvas.height / 2;
            statusText.innerText = `Build Mode: Place ${itemType}.`;
        }

        function exitBuildMode() {
            buildMode.active = false;
            buildOverlay.style.display = 'none';
            statusText.innerText = `Active Slot: ${activeSlot + 1} (${hotbarItems[activeSlot] ? hotbarItems[activeSlot].type : 'Empty'})`;
        }

        window.addEventListener('pointermove', (e) => {
            if (!buildMode.active) return;
            buildMode.touchX = e.clientX;
            buildMode.touchY = e.clientY;
        });

        function setActiveSlot(index) {
            activeSlot = index;
            document.querySelectorAll('.slot').forEach((s, idx) => {
                if (idx === index) s.classList.add('active');
                else s.classList.remove('active');
            });
            updateHandButton();
            statusText.innerText = `Active Slot: ${index + 1} (${hotbarItems[activeSlot] ? hotbarItems[activeSlot].type : 'Empty'})`;
        }

        function updateHandButton() {
            const activeItem = hotbarItems[activeSlot];
            const nearestCraftingTable = findNearestCraftingTable();
            const isNearCraftingTable = nearestCraftingTable && getDistance(player, nearestCraftingTable) < TILE_SIZE * 1.5;

            if (isNearCraftingTable) {
                handButton.style.display = "flex";
                handButtonText.innerText = "OPEN";
                document.querySelector('#hand-button .btn-icon').innerText = "📦";
                return; // Prioritize opening crafting table
            }

            if (activeItem) {
                handButton.style.display = "flex";
                switch (activeItem.type) {
                    case "hook":
                        handButtonText.innerText = "THROW";
                        document.querySelector('#hand-button .btn-icon').innerText = "🖐️";
                        break;
                    case "potato":
                        handButtonText.innerText = "EAT";
                        document.querySelector('#hand-button .btn-icon').innerText = "🥔";
                        break;
                    case "cup":
                        handButtonText.innerText = "FILL";
                        document.querySelector('#hand-button .btn-icon').innerText = "🥛";
                        break;
                    case "cup_filled":
                        handButtonText.innerText = "DRINK";
                        document.querySelector('#hand-button .btn-icon').innerText = "💧";
                        break;
                    default:
                        handButtonText.innerText = "USE";
                        document.querySelector('#hand-button .btn-icon').innerText = "🖐️";
                        break;
                }
            } else {
                handButton.style.display = "none";
            }
        }

        function findNearestCraftingTable() {
            let nearest = null;
            let minDist = Infinity;
            for (const key in raftGrid) {
                const obj = raftGrid[key];
                if (obj.type === 'crafting_table') {
                    const coords = key.split(',').map(Number);
                    const tableX = coords[0] * TILE_SIZE + TILE_SIZE / 2;
                    const tableY = coords[1] * TILE_SIZE + TILE_SIZE / 2;
                    const dist = Math.sqrt(Math.pow(player.x - tableX, 2) + Math.pow(player.y - tableY, 2));
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = { x: tableX, y: tableY, gridX: coords[0], gridY: coords[1] };
                    }
                }
            }
            return nearest;
        }

        function getDistance(obj1, obj2) {
            return Math.sqrt(Math.pow(obj1.x - obj2.x, 2) + Math.pow(obj1.y - obj2.y, 2));
        }

        // --- Hook Throwing Charge Input Controllers Interface ---
        handButton.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            const activeItem = hotbarItems[activeSlot];
            const nearestCraftingTable = findNearestCraftingTable();
            const isNearCraftingTable = nearestCraftingTable && getDistance(player, nearestCraftingTable) < TILE_SIZE * 1.5;

            if (isNearCraftingTable) {
                craftingMenuScreen.style.display = 'block';
                updateCraftingRecipeAvailability();
                statusText.innerText = "Crafting Table opened.";
                return;
            }

            if (!activeItem) return;

            if (activeItem.type === "hook") {
                if (hookTool.state === "IDLE") {
                    hookTool.state = "CHARGING";
                    hookTool.chargeTimer = 0;
                    hookTool.chargeColor = "yellow";
                    hookTool.ringRadius = 15;
                    handButton.setPointerCapture(e.pointerId);
                }
            } else if (activeItem.type === "potato") {
                eatPotato(activeSlot);
            } else if (activeItem.type === "cup") {
                fillCup(activeSlot);
            } else if (activeItem.type === "cup_filled") {
                drinkWater(activeSlot);
            }
        });

        handButton.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            if (hookTool.state === "CHARGING") {
                handButton.releasePointerCapture(e.pointerId);
                throwHook();
            }
        });

        function throwHook() {
            hookTool.state = "THROWN";
            hookTool.x = player.x;
            hookTool.y = player.y;
            hookTool.startX = player.x;
            hookTool.startY = player.y;

            let throwDistance = hookTool.ringRadius * 3.5; 
            
            let angle = -Math.PI / 2; // Default to throwing straight up
            if (combinedMoveVector.x !== 0 || combinedMoveVector.y !== 0) {
                angle = Math.atan2(combinedMoveVector.y, combinedMoveVector.x);
            } else if (moveVector.x !== 0 || moveVector.y !== 0) { // Fallback to joystick if keyboard is idle
                angle = Math.atan2(moveVector.y, moveVector.x);
            }

            hookTool.targetX = player.x + Math.cos(angle) * throwDistance;
            hookTool.targetY = player.y + Math.sin(angle) * throwDistance;
        }

        function eatPotato(slotIndex) {
            const potato = hotbarItems[slotIndex];
            if (potato && potato.type === "potato") {
                player.hunger = 100; // Fill hunger bar
                removeItemFromHotbar(slotIndex, 1);
                syncHungerThirstHUD();
                renderHotbarUI();
                statusText.innerText = "Ate a potato! Hunger restored.";
            }
        }

        function fillCup(slotIndex) {
            const cup = hotbarItems[slotIndex];
            if (cup && cup.type === "cup" && player.inWater) {
                hotbarItems[slotIndex] = { type: "cup_filled", count: 1 };
                renderHotbarUI();
                statusText.innerText = "Cup filled with water!";
            } else if (!player.inWater) {
                statusText.innerText = "Must be in water to fill cup.";
            }
        }

        function drinkWater(slotIndex) {
            const filledCup = hotbarItems[slotIndex];
            if (filledCup && filledCup.type === "cup_filled") {
                player.thirst = 100; // Fill thirst bar
                hotbarItems[slotIndex] = { type: "cup", count: 1 }; // Cup becomes empty again
                syncHungerThirstHUD();
                renderHotbarUI();
                statusText.innerText = "Drank water! Thirst restored.";
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        const maxDrag = 45; 

        joystickZone.addEventListener('pointerdown', (e) => {
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickStart = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            joystickZone.setPointerCapture(e.pointerId);
            handleJoystickMove(e);
        });

        joystickZone.addEventListener('pointermove', (e) => {
            if (!joystickActive) return;
            handleJoystickMove(e);
        });

        function handleJoystickMove(e) {
            let dx = e.clientX - joystickStart.x;
            let dy = e.clientY - joystickStart.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxDrag) {
                dx = (dx / distance) * maxDrag;
                dy = (dy / distance) * maxDrag;
                distance = maxDrag;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxDrag;
            moveVector.y = dy / maxDrag;
        }

        function resetJoystick() {
            joystickActive = false;
            joystickStick.style.transform = `translate(0px, 0px)`;
            moveVector.x = 0;
            moveVector.y = 0;
        }

        joystickZone.addEventListener('pointerup', resetJoystick);
        joystickZone.addEventListener('pointercancel', resetJoystick);

        // Keyboard Controls
        let tKeyHeld = false;
        let tKeyChargeTimer = 0;
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'].includes(key)) {
                keysPressed[key] = true;
                updateKeyboardMoveVector();
                e.preventDefault(); // Prevent default browser scrolling
            } else if (key === 'b') {
                bagBtn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            } else if (key === 'c') {
                hammerBtn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            } else if (key === 't') {
                if (!tKeyHeld) {
                    tKeyHeld = true;
                    tKeyChargeTimer = 0;
                    if (hotbarItems[activeSlot] && hotbarItems[activeSlot].type === "hook" && hookTool.state === "IDLE") {
                        hookTool.state = "CHARGING";
                        hookTool.chargeTimer = 0;
                        hookTool.chargeColor = "yellow";
                        hookTool.ringRadius = 15;
                    }
                }
            } else if (key >= '1' && key <= '8') {
                setActiveSlot(parseInt(key) - 1);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'].includes(key)) {
                delete keysPressed[key];
                updateKeyboardMoveVector();
                e.preventDefault();
            } else if (key === 't') {
                if (tKeyHeld) {
                    tKeyHeld = false;
                    if (hookTool.state === "CHARGING") {
                        throwHook();
                    }
                }
            }
        });

        function updateKeyboardMoveVector() {
            keyboardMoveVector.x = 0;
            keyboardMoveVector.y = 0;
            if (keysPressed['a'] || keysPressed['arrowleft']) keyboardMoveVector.x = -1;
            if (keysPressed['d'] || keysPressed['arrowright']) keyboardMoveVector.x = 1;
            if (keysPressed['w'] || keysPressed['arrowup']) keyboardMoveVector.y = -1;
            if (keysPressed['s'] || keysPressed['arrowdown']) keyboardMoveVector.y = 1;

            // Normalize diagonal movement
            if (keyboardMoveVector.x !== 0 && keyboardMoveVector.y !== 0) {
                const length = Math.sqrt(keyboardMoveVector.x * keyboardMoveVector.x + keyboardMoveVector.y * keyboardMoveVector.y);
                keyboardMoveVector.x /= length;
                keyboardMoveVector.y /= length;
            }
        }

        function isStandingOnRaft(x, y) {
            // Check all four corners of the player for collision with raft pieces
            const playerCorners = [
                { px: x, py: y },
                { px: x + player.width, py: y },
                { px: x, py: y + player.height },
                { px: x + player.width, py: y + player.height }
            ];

            for (const corner of playerCorners) {
                const gx = Math.floor(corner.px / TILE_SIZE);
                const gy = Math.floor(corner.py / TILE_SIZE);
                const raftPiece = raftGrid[getGridKey(gx, gy)];
                if (raftPiece && raftPiece.walkable) {
                    return true;
                }
            }
            return false;
        }

        function isWalkable(x, y) {
            // Check all four corners of the player for collision with non-walkable raft objects
            const playerCorners = [
                { px: x, py: y },
                { px: x + player.width, py: y },
                { px: x, py: y + player.height },
                { px: x + player.width, py: y + player.height }
            ];

            for (const corner of playerCorners) {
                const gx = Math.floor(corner.px / TILE_SIZE);
                const gy = Math.floor(corner.py / TILE_SIZE);
                const raftObject = raftGrid[getGridKey(gx, gy)];
                if (raftObject && !raftObject.walkable) {
                    return false; // Found a non-walkable object
                }
            }
            return true; // All corners are walkable or in water
        }

        function getOffscreenPosition() {
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnDistance = Math.max(canvas.width, canvas.height) / 1.3 + 120;
            return {
                x: player.x + Math.cos(spawnAngle) * spawnDistance,
                y: player.y + Math.sin(spawnAngle) * spawnDistance
            };
        }

        function syncHeartsHUD() {
            for (let i = 0; i < 4; i++) {
                const heartEl = document.getElementById(`heart-${i}`);
                if (heartEl) {
                    if (i < player.health) {
                        heartEl.classList.remove('lost');
                    } else {
                        heartEl.classList.add('lost');
                    }
                }
            }
        }

        function syncHungerThirstHUD() {
            const hungerFill = document.querySelector('#hunger-bar .stat-fill');
            const thirstFill = document.querySelector('#thirst-bar .stat-fill');
            hungerFill.style.width = `${player.hunger}%`;
            thirstFill.style.width = `${player.thirst}%`;
        }

        function spawnOceanObject() {
            const typeData = OCEAN_OBJECT_TYPES[Math.floor(Math.random() * OCEAN_OBJECT_TYPES.length)];
            const spawnX = player.x + (Math.random() * canvas.width * 1.5) - (canvas.width * 0.75); // Spawn across a wider range
            const spawnY = player.y - (canvas.height / 2) - 100; // Spawn above the screen
            oceanObjects.push({
                x: spawnX,
                y: spawnY,
                type: typeData.type,
                color: typeData.color,
                width: typeData.width,
                height: typeData.height,
                speed: 0.8 + Math.random() * 0.5, // Slightly varied speed
                contents: typeData.contents ? [...typeData.contents] : null // Copy contents for barrels
            });
        }

        function getItemCount(type) {
            let count = 0;
            hotbarItems.forEach(item => {
                if (item && item.type === type) count += item.count;
            });
            inventoryItems.forEach(item => {
                if (item && item.type === type) count += item.count;
            });
            return count;
        }

        function addItemToInventory(type, count) {
            let remainingCount = count;

            // Determine target array based on item type
            let targetArrays = [];
            if (FOOD_ITEMS.includes(type) || DRINK_ITEMS.includes(type)) {
                targetArrays.push(hotbarItems); // Food and cups go to hotbar first
                targetArrays.push(inventoryItems);
            } else {
                targetArrays.push(inventoryItems); // Other items go to inventory first (bag)
                targetArrays.push(hotbarItems);
            }

            // Try to stack in existing slots first
            const tryStack = (arr) => {
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i] && arr[i].type === type && arr[i].count < ITEM_STACK_LIMITS[type]) {
                        const space = ITEM_STACK_LIMITS[type] - arr[i].count;
                        const transfer = Math.min(remainingCount, space);
                        arr[i].count += transfer;
                        remainingCount -= transfer;
                        if (remainingCount <= 0) return true;
                    }
                }
                return false;
            };

            // Try to find empty slots
            const tryEmptySlot = (arr) => {
                for (let i = 0; i < arr.length; i++) {
                    if (!arr[i]) {
                        const transfer = Math.min(remainingCount, ITEM_STACK_LIMITS[type]);
                        arr[i] = { type: type, count: transfer };
                        remainingCount -= transfer;
                        if (remainingCount <= 0) return true;
                    }
                }
                return false;
            };

            for (const arr of targetArrays) {
                if (tryStack(arr)) return;
            }
            for (const arr of targetArrays) {
                if (tryEmptySlot(arr)) return;
            }

            if (remainingCount > 0) {
                console.warn(`Inventory full! Could not add ${remainingCount} of ${type}.`);
                statusText.innerText = "Inventory Full!";
            }
        }

        function removeItemFromInventory(type, count) {
            let removedCount = 0;
            const removeFromArray = (arr) => {
                for (let i = arr.length - 1; i >= 0; i--) {
                    if (arr[i] && arr[i].type === type) {
                        const toRemove = Math.min(count - removedCount, arr[i].count);
                        arr[i].count -= toRemove;
                        removedCount += toRemove;
                        if (arr[i].count <= 0) {
                            arr[i] = null;
                        }
                        if (removedCount >= count) return true;
                    }
                }
                return false;
            };

            if (removeFromArray(hotbarItems)) return;
            removeFromArray(inventoryItems);
        }

        function removeItemFromHotbar(slotIndex, count) {
            if (hotbarItems[slotIndex] && hotbarItems[slotIndex].type === "potato") {
                hotbarItems[slotIndex].count -= count;
                if (hotbarItems[slotIndex].count <= 0) {
                    hotbarItems[slotIndex] = null;
                }
            }
        }

        function resetGame() {
            player = { ...initialPlayerState };
            shark = { ...initialSharkState };
            buildMode = { ...initialBuildModeState };
            hotbarItems = initialHotbarItems.map(item => item ? { ...item } : null); // Deep copy
            inventoryItems = initialInventoryItems.map(item => item ? { ...item } : null); // Deep copy
            dragManager = { ...initialDragManagerState };
            hookTool = { ...initialHookToolState };
            raftGrid = {}; 
            initRaft(); 
            oceanObjects = []; 
            oceanObjectSpawnTimer = 0;
            activeSlot = 0; 
            keysPressed = {};
            keyboardMoveVector = { x: 0, y: 0 };
            combinedMoveVector = { x: 0, y: 0 };

            renderHotbarUI(); 
            renderInventorySlots();
            syncHeartsHUD(); 
            syncHungerThirstHUD();
            exitBuildMode(); 
            resetJoystick(); 
            statusText.innerText = `Active Slot: ${activeSlot + 1} (Hook Selected)`;
            invScreen.style.display = 'none'; // Ensure inventory is closed
            craftingMenuScreen.style.display = 'none'; // Ensure crafting menu is closed
            playersListScreen.style.display = 'none'; // Ensure players list is closed
            inviteReceivedScreen.style.display = 'none'; // Ensure invite is closed
            registrationScreen.style.display = registeredCharacterName ? 'none' : 'flex'; // Show registration if not registered
            registrationError.style.display = 'none';
            characterNameInput.value = registeredCharacterName || '';
        }

        function update() {
            // Combine joystick and keyboard input
            combinedMoveVector.x = moveVector.x + keyboardMoveVector.x;
            combinedMoveVector.y = moveVector.y + keyboardMoveVector.y;

            // Normalize combined vector if both inputs are active
            if (combinedMoveVector.x !== 0 && combinedMoveVector.y !== 0) {
                const length = Math.sqrt(combinedMoveVector.x * combinedMoveVector.x + combinedMoveVector.y * combinedMoveVector.y);
                combinedMoveVector.x /= length;
                combinedMoveVector.y /= length;
            } else if (combinedMoveVector.x === 0 && combinedMoveVector.y === 0) {
                // If both are zero, ensure it's truly zero
                combinedMoveVector.x = 0;
                combinedMoveVector.y = 0;
            }

            const wasInWater = player.inWater;
            player.inWater = !isStandingOnRaft(player.x, player.y);
            
            if (wasInWater && !player.inWater) { // Just got out of water
                shark.lastWaterExitTime = Date.now();
            }

            let currentSpeed = player.inWater ? (BASE_SPEED / 4) : BASE_SPEED;

            // Player movement with collision detection for non-walkable raft objects
            const targetX = player.x + combinedMoveVector.x * currentSpeed;
            const targetY = player.y + combinedMoveVector.y * currentSpeed;

            // Check X movement
            if (isWalkable(targetX, player.y)) {
                player.x = targetX;
            }
            // Check Y movement
            if (isWalkable(player.x, targetY)) {
                player.y = targetY;
            }

            // Hunger and Thirst Decay
            let currentTime = Date.now();
            if (currentTime - player.lastStatDecayTime >= 1000) { // Decay every second
                if (player.hunger > 0) player.hunger -= 0.5 / 2; // Twice as long for hunger
                if (player.thirst > 0) player.thirst -= 0.7 / 4; // Four times as long for thirst
                
                if (player.hunger < 0) player.hunger = 0;
                if (player.thirst < 0) player.thirst = 0;

                // Health impact from low hunger/thirst
                if (player.hunger === 0 || player.thirst === 0) {
                    if (currentTime - player.lastBiteTime >= 2000) { // Lose health every 2 seconds if starving/dehydrated
                        if (player.health > 0) {
                            player.health--;
                            syncHeartsHUD();
                        }
                        player.lastBiteTime = currentTime; // Reuse lastBiteTime for general damage timer
                    }
                }

                syncHungerThirstHUD();
                player.lastStatDecayTime = currentTime;
            }


            // Ocean Object Spawning
            oceanObjectSpawnTimer++;
            if (oceanObjectSpawnTimer >= OCEAN_OBJECT_SPAWN_INTERVAL) {
                spawnOceanObject();
                oceanObjectSpawnTimer = 0;
            }

            // Ocean Object Movement and Removal
            for (let i = oceanObjects.length - 1; i >= 0; i--) {
                const obj = oceanObjects[i];
                obj.y += obj.speed; // Move downwards
                // Remove if far off screen
                if (obj.y > player.y + (canvas.height / 2) + 100) {
                    oceanObjects.splice(i, 1);
                }
            }

            // --- Hook Tool Mechanics State Tracker Animation ---
            if (hookTool.state === "CHARGING") {
                hookTool.chargeTimer++;
                if (hookTool.ringRadius < 85) {
                    hookTool.ringRadius += 0.8;
                }
                if (hookTool.chargeTimer > 70) {
                    hookTool.chargeColor = "green";
                    hookTool.blinkTimer++;
                }
            }

            if (hookTool.state === "THROWN" || hookTool.state === "RETURNING") {
                // Hook collision with ocean objects (both directions)
                if (!hookTool.carriedObject) {
                    const hookCenterX = hookTool.x;
                    const hookCenterY = hookTool.y;
                    const hookRadius = hookTool.width / 2; // Approximate collision radius

                    for (let i = oceanObjects.length - 1; i >= 0; i--) {
                        const obj = oceanObjects[i];
                        
                        // Simple AABB collision check (hook as a circle, object as a rect)
                        let testX = hookCenterX;
                        let testY = hookCenterY;

                        if (hookCenterX < obj.x) testX = obj.x;
                        else if (hookCenterX > obj.x + obj.width) testX = obj.x + obj.width;
                        if (hookCenterY < obj.y) testY = obj.y;
                        else if (hookCenterY > obj.y + obj.height) testY = obj.y + obj.height;

                        let distX = hookCenterX - testX;
                        let distY = hookCenterY - testY;
                        let distance = Math.sqrt((distX * distX) + (distY * distY));

                        if (distance <= hookRadius) {
                            hookTool.state = "RETURNING";
                            hookTool.carriedObject = obj;
                            oceanObjects.splice(i, 1); // Remove from floating objects
                            break; // Only pick up one object at a time
                        }
                    }
                }
            }

            if (hookTool.state === "THROWN") {
                let dx = hookTool.targetX - hookTool.x;
                let dy = hookTool.targetY - hookTool.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 6) {
                    let angle = Math.atan2(dy, dx);
                    hookTool.x += Math.cos(angle) * hookTool.speed;
                    hookTool.y += Math.sin(angle) * hookTool.speed;
                } else {
                    hookTool.state = "RETURNING";
                }
            }

            if (hookTool.state === "RETURNING") {
                let dx = player.x - hookTool.x;
                let dy = player.y - hookTool.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 10) {
                    let angle = Math.atan2(dy, dx);
                    hookTool.x += Math.cos(angle) * hookTool.returnSpeed;
                    hookTool.y += Math.sin(angle) * hookTool.returnSpeed;
                } else {
                    // Hook reached player
                    if (hookTool.carriedObject) {
                        if (hookTool.carriedObject.type === "barrel" && hookTool.carriedObject.contents) {
                            hookTool.carriedObject.contents.forEach(item => {
                                addItemToInventory(item.type, item.count);
                            });
                            statusText.innerText = `Collected barrel contents!`;
                        } else {
                            addItemToInventory(hookTool.carriedObject.type, 1);
                            statusText.innerText = `Collected: ${hookTool.carriedObject.type}`;
                        }
                        renderInventorySlots();
                        renderHotbarUI();
                        hookTool.carriedObject = null; // Drop the object
                    }
                    hookTool.state = "IDLE";
                }
                // Update carried object position to follow hook
                if (hookTool.carriedObject) {
                    hookTool.carriedObject.x = hookTool.x - hookTool.carriedObject.width / 2;
                    hookTool.carriedObject.y = hookTool.y - hookTool.carriedObject.height / 2;
                }
            }

            // --- Shark Smart State Machine Manager ---
            if (player.inWater) {
                shark.lastWaterExitTime = 0; // Reset timer if player is in water
                if (shark.state === "HIDDEN" || shark.state === "RETREATING") {
                    shark.state = "WAITING";
                    shark.timer = 0; 
                }

                if (shark.state === "WAITING") {
                    shark.timer++;
                    if (shark.timer >= 180) { // Wait 3 seconds
                        if (!shark.active) {
                            const spawnPos = getOffscreenPosition();
                            shark.x = spawnPos.x;
                            shark.y = spawnPos.y;
                            shark.active = true;
                        }
                        shark.targetX = player.x;
                        shark.targetY = player.y;
                        shark.state = "CHASING";
                    }
                }
            } else { // Player is on raft
                if (shark.state === "CHASING") {
                    shark.state = "RETREATING";
                    const escapePoint = getOffscreenPosition();
                    shark.targetX = escapePoint.x;
                    shark.targetY = escapePoint.y;
                }

                if (shark.state === "WAITING") { // If player gets out while shark is waiting
                    shark.state = "HIDDEN";
                }

                if (shark.state === "RETREATING" && !shark.active && shark.lastWaterExitTime > 0 && (currentTime - shark.lastWaterExitTime >= 10000)) { // 10 seconds after leaving water
                    shark.state = "HIDDEN";
                    shark.lastWaterExitTime = 0;
                }
            }

            if (shark.state === "CHASING" || shark.state === "RETREATING") {
                let dx = shark.targetX - shark.x;
                let dy = shark.targetY - shark.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                shark.angle = Math.atan2(dy, dx);

                let currentSharkSpeed = (shark.state === "RETREATING") ? (shark.speed * 1.5) : shark.speed;

                if (dist > 2) {
                    shark.x += Math.cos(shark.angle) * currentSharkSpeed;
                    shark.y += Math.sin(shark.angle) * currentSharkSpeed;
                }

                // --- SHARK ATTACK / BITE LOOP ---
                if (shark.state === "CHASING" && dist < 18) {
                    let currentTime = Date.now();
                    if (currentTime - player.lastBiteTime >= 1000) { // Every 1 whole second
                        if (player.health > 0) {
                            player.health--;
                            syncHeartsHUD();
                        }
                        player.lastBiteTime = currentTime;
                    }
                }
            }

            let sOffsetX = canvas.width / 2 - player.x;
            let sOffsetY = canvas.height / 2 - player.y;
            let sharkRenderX = shark.x + sOffsetX;
            let sharkRenderY = shark.y + sOffsetY;
            let isOffscreen = (sharkRenderX < -120 || sharkRenderX > canvas.width + 120 || sharkRenderY < -120 || sharkRenderY > canvas.height + 120);

            if (isOffscreen && shark.active && shark.state === "RETREATING") {
                shark.offscreenTimer++;
                if (shark.offscreenTimer >= 180) { // 3 seconds offscreen
                    shark.state = "HIDDEN";
                    shark.active = false;
                    shark.offscreenTimer = 0;
                }
            } else {
                shark.offscreenTimer = 0; 
            }

            if (buildMode.active) {
                const worldTouchX = buildMode.touchX - (canvas.width / 2 - player.x);
                const worldTouchY = buildMode.touchY - (canvas.height / 2 - player.y);
                
                // Only update gridX/Y if touch is significantly off center to avoid jitter
                if (Math.abs(buildMode.touchX - canvas.width/2) > 40 || Math.abs(buildMode.touchY - canvas.height/2) > 40) {
                    buildMode.gridX = Math.floor(worldTouchX / TILE_SIZE);
                    buildMode.gridY = Math.floor(worldTouchY / TILE_SIZE);
                }

                // Build mode validation
                const targetKey = getGridKey(buildMode.gridX, buildMode.gridY);
                const isOccupied = raftGrid[targetKey];
                
                let hasResources = false;
                const recipe = CRAFTING_RECIPES[buildMode.buildItemType];
                if (recipe) {
                    hasResources = recipe.cost.every(costItem => getItemCount(costItem.type) >= costItem.count);
                } else if (buildMode.buildItemType === 'raft_piece') {
                    hasResources = getItemCount("wood") >= 2;
                }

                // Check adjacency: must be next to an existing raft piece
                let isAdjacent = false;
                const adjacentCoords = [
                    getGridKey(buildMode.gridX + 1, buildMode.gridY),
                    getGridKey(buildMode.gridX - 1, buildMode.gridY),
                    getGridKey(buildMode.gridX, buildMode.gridY + 1),
                    getGridKey(buildMode.gridX, buildMode.gridY - 1)
                ];
                for (const adjKey of adjacentCoords) {
                    if (raftGrid[adjKey] && raftGrid[adjKey].type === 'raft_piece') {
                        isAdjacent = true;
                        break;
                    }
                }

                buildMode.isValidPlacement = !isOccupied && isAdjacent;
                buildMode.hasEnoughResources = hasResources;
            }
            updateHandButton(); // Update hand button text/icon dynamically
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const offsetX = canvas.width / 2 - player.x;
            const offsetY = canvas.height / 2 - player.y;

            // 1. SHARK UNDERWATER LAYER (only visible when chasing)
            if (shark.active && (shark.state === "CHASING" || shark.state === "RETREATING")) {
                const sx = shark.x + offsetX;
                const sy = shark.y + offsetY;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(shark.angle);
                ctx.fillStyle = (shark.state === "CHASING") ? '#b53333' : '#4a6572'; 
                ctx.beginPath();
                ctx.moveTo(-16, 0);
                ctx.lineTo(0, -10);
                ctx.lineTo(16, 0);
                ctx.lineTo(0, 10);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(6, -5, 2, 2);
                ctx.fillRect(6, 3, 2, 2);
                ctx.restore();
            }

            // 2. OCEAN OBJECTS LAYER
            for (const obj of oceanObjects) {
                const ox = obj.x + offsetX;
                const oy = obj.y + offsetY;
                ctx.fillStyle = obj.color;
                ctx.fillRect(ox, oy, obj.width, obj.height);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(ox, oy, obj.width, obj.height);
                // Draw icon for barrel
                if (obj.type === 'barrel') {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'white';
                    ctx.fillText(getItemIcon(obj.type), ox + obj.width / 2, oy + obj.height / 2);
                }
            }

            // 3. ROPE THROWING ATTACHMENT LINE
            if (hookTool.state === "THROWN" || hookTool.state === "RETURNING") {
                ctx.strokeStyle = '#d7ccc8'; 
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, canvas.height / 2); 
                ctx.lineTo(hookTool.x + offsetX, hookTool.y + offsetY);
                ctx.stroke();
            }

            // 4. RAFT TILE BLOCKS RENDER LAYER
            for (let key in raftGrid) {
                const obj = raftGrid[key];
                const coords = key.split(',');
                const gx = parseInt(coords[0]);
                const gy = parseInt(coords[1]);

                const rx = gx * TILE_SIZE + offsetX;
                const ry = gy * TILE_SIZE + offsetY;

                if (rx + TILE_SIZE > 0 && rx < canvas.width && ry + TILE_SIZE > 0 && ry < canvas.height) {
                    if (obj.type === 'raft_piece') {
                        ctx.fillStyle = '#b38659'; 
                        ctx.strokeStyle = '#664d33'; 
                        ctx.lineWidth = 2;
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                        ctx.fillRect(rx + 2, ry + 4, TILE_SIZE - 4, 6);
                        ctx.fillRect(rx + 2, ry + 18, TILE_SIZE - 4, 6);
                    } else if (obj.type === 'crafting_table') {
                        ctx.fillStyle = '#8B4513'; // Darker wood for table
                        ctx.strokeStyle = '#5a3a1c';
                        ctx.lineWidth = 2;
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#4a2c1a'; // Tabletop color
                        ctx.fillRect(rx + 2, ry + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.font = '16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = 'white';
                        ctx.fillText(getItemIcon(obj.type), rx + TILE_SIZE / 2, ry + TILE_SIZE / 2);
                    }
                }
            }

            // 5. BUILD PREVIEW INDICATOR SYSTEM
            if (buildMode.active) {
                const bx = buildMode.gridX * TILE_SIZE + offsetX;
                const by = buildMode.gridY * TILE_SIZE + offsetY;

                let fillColor = 'rgba(46, 204, 113, 0.4)'; // Green for valid
                let strokeColor = '#2ecc71';
                if (!buildMode.isValidPlacement || !buildMode.hasEnoughResources) {
                    fillColor = 'rgba(231, 76, 60, 0.4)'; // Red for invalid
                    strokeColor = '#e74c3c';
                }

                ctx.fillStyle = fillColor;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 3;
                ctx.fillRect(bx, by, TILE_SIZE, TILE_SIZE);
                ctx.strokeRect(bx, by, TILE_SIZE, TILE_SIZE);
                
                // Draw icon for the item being built
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.fillText(getItemIcon(buildMode.buildItemType), bx + TILE_SIZE / 2, by + TILE_SIZE / 2);
            }

            // 6. SMALL GRAY HOOK BOX TOOL PROFILE OBJECT
            if (hookTool.state === "THROWN" || hookTool.state === "RETURNING") {
                const hx = hookTool.x + offsetX - hookTool.width / 2;
                const hy = hookTool.y + offsetY - hookTool.height / 2;
                ctx.fillStyle = '#7f8c8d'; 
                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 1.5;
                ctx.fillRect(hx, hy, hookTool.width, hookTool.height);
                ctx.strokeRect(hx, hy, hookTool.width, hookTool.height);
            }

            // 7. CARRIED OBJECT ATTACHED TO HOOK
            if (hookTool.carriedObject) {
                const obj = hookTool.carriedObject;
                const ox = obj.x + offsetX;
                const oy = obj.y + offsetY;
                ctx.fillStyle = obj.color;
                ctx.fillRect(ox, oy, obj.width, obj.height);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(ox, oy, obj.width, obj.height);
                // Draw icon for barrel
                if (obj.type === 'barrel') {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'white';
                    ctx.fillText(getItemIcon(obj.type), ox + obj.width / 2, oy + obj.height / 2);
                }
            }

            // 8. CHARACTER RENDER PLAYER LAYER
            const px = canvas.width / 2 - player.width / 2;
            const py = canvas.height / 2 - player.height / 2;

            ctx.fillStyle = player.color;
            ctx.fillRect(px, py, player.width, player.height);
            ctx.strokeStyle = '#5a3a1c';
            ctx.lineWidth = 2;
            ctx.strokeRect(px, py, player.width, player.height);

            if (player.inWater) {
                ctx.fillStyle = 'rgba(43, 92, 143, 0.75)';
                ctx.fillRect(px - 1, py + player.height / 2, player.width + 2, player.height / 2 + 1);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2 + 6, 16 + Math.sin(Date.now() * 0.005) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // CHARGING RING RENDERING LOOPS
            if (hookTool.state === "CHARGING") {
                if (hookTool.chargeColor === "yellow" || (hookTool.chargeColor === "green" && Math.floor(hookTool.blinkTimer / 6) % 2 === 0)) {
                    ctx.strokeStyle = hookTool.chargeColor === "yellow" ? '#f1c40f' : '#2ecc71';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, hookTool.ringRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = player.eyeColor;
            let eyeOffsetX = 0;
            let eyeOffsetY = 0;
            if (Math.abs(combinedMoveVector.x) > 0.2) eyeOffsetX = Math.sign(combinedMoveVector.x) * 2;
            if (Math.abs(combinedMoveVector.y) > 0.2) eyeOffsetY = Math.sign(combinedMoveVector.y) * 2;
            let waterEyeYShift = player.inWater ? 1 : 0;

            ctx.fillRect(px + 4 + eyeOffsetX, py + 6 + eyeOffsetY + waterEyeYShift, 5, 5);
            ctx.fillRect(px + 13 + eyeOffsetX, py + 6 + eyeOffsetY + waterEyeYShift, 5, 5);

            ctx.fillStyle = player.pupilColor;
            ctx.fillRect(px + 6 + eyeOffsetX, py + 8 + eyeOffsetY + waterEyeYShift, 2, 2);
            ctx.fillRect(px + 15 + eyeOffsetX, py + 8 + eyeOffsetY + waterEyeYShift, 2, 2);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize game state
        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
