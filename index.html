<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raft Framework</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #2b5c8f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }

        /* Top Left UI */
        #top-left-ui { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; z-index: 10; }
        #restart-button, #players-online-button { background: rgba(0, 0, 0, 0.6); color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        #players-online-button { display: flex; align-items: center; gap: 6px; }

        /* Status Bars (Hunger/Thirst) */
        #status-bars-container { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; z-index: 10; }
        .stat-bar { width: 100px; height: 16px; background: rgba(0, 0, 0, 0.5); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; }
        .stat-bar-label { color: white; font-size: 10px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 0 0 2px black; }
        .stat-fill { height: 100%; width: 100%; border-radius: 8px; transition: width 0.1s ease-out; }
        #hunger-bar .stat-fill { background: linear-gradient(to right, #e67e22, #f39c12); }
        #thirst-bar .stat-fill { background: linear-gradient(to right, #3498db, #2980b9); }

        #status-text { pointer-events: auto; background: rgba(0, 0, 0, 0.6); color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; align-self: center; }
        #joystick-zone { position: absolute; bottom: 80px; left: 30px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.8); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #hearts-container { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; background: rgba(0, 0, 0, 0.5); padding: 4px 10px; border-radius: 12px; }
        .heart-icon { font-size: 18px; }
        .heart-icon.lost { filter: grayscale(1) brightness(0.6); }
        #hotbar-container { width: 100%; display: flex; justify-content: center; pointer-events: auto; margin-bottom: env(safe-area-inset-bottom, 0px); }
        .hotbar { display: flex; background: rgba(40, 40, 40, 0.85); padding: 6px; border-radius: 12px; border: 2px solid #555; gap: 6px; }
        .slot { width: 44px; height: 44px; background: #1a1a1a; border: 2px solid #777; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; position: relative; }
        .slot.active { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; background: #333; }
        .slot-num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #aaa; }
        .item-icon { width: 32px; height: 32px; background-color: #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: white; text-shadow: 0 0 2px black; }
        .item-icon.wood { background-color: #8B4513; }
        .item-icon.leaf { background-color: #228B22; }
        .item-icon.scrap_metal { background-color: #7f8c8d; }
        .item-icon.potato { background-color: #e6b32e; }
        .item-icon.hook { background-color: #7f8c8d; border: 2px solid #bdc3c7; }
        .item-icon.wood_plank { background-color: #b38659; }
        .item-icon.crafting_table { background-color: #b38659; }
        .item-icon.rope { background-color: #6d4c41; }
        .item-icon.cup { background-color: #bdc3c7; }
        .item-icon.cup_filled { background-color: #3498db; }

        #action-buttons-stack { position: absolute; bottom: 75px; right: 25px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .hud-btn { width: 55px; height: 55px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.4); color: white; font-weight: bold; font-size: 10px; }
        #hand-button { background: #7f8c8d; border: 3px solid #34495e; }
        #hammer-button { background: #b38659; border: 3px solid #664d33; }
        #bag-button { background: #8B5A2B; border: 3px solid #5a3a1c; }
        .btn-icon { font-size: 18px; margin-bottom: -2px; }

        #build-controls-overlay { position: absolute; bottom: 75px; right: 25px; display: none; flex-direction: column; gap: 12px; pointer-events: auto; }
        .build-btn { width: 55px; height: 55px; border-radius: 12px; border: 3px solid white; color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
        #btn-confirm-build { background: #2ecc71; }
        #btn-cancel-build { background: #e74c3c; }

        /* Inventory Screen */
        #inventory-screen { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: rgba(30, 30, 30, 0.95); border: 3px solid #444; border-radius: 16px; padding: 14px; display: none; pointer-events: auto; z-index: 10; }
        #inventory-header { color: white; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        #close-inv-btn { background: #cc3333; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
        #inventory-scroll-container { width: 100%; height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .inv-slot { aspect-ratio: 1; background: #111; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.4); font-size: 11px; font-weight: bold; position: relative; }

        /* Crafting Menu Screen */
        #crafting-menu-screen { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: rgba(30, 30, 30, 0.95); border: 3px solid #444; border-radius: 16px; padding: 14px; display: none; pointer-events: auto; z-index: 10; }
        #crafting-menu-header { color: white; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        #close-craft-btn { background: #cc3333; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
        #crafting-recipes { display: flex; flex-direction: column; gap: 10px; }
        .craft-recipe { display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 8px; border-radius: 8px; border: 1px solid #555; cursor: pointer; }
        .craft-recipe:hover { background: rgba(0, 0, 0, 0.6); }
        .recipe-output-icon { width: 40px; height: 40px; border-radius: 6px; margin-right: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .recipe-details { flex-grow: 1; color: white; font-size: 14px; }
        .recipe-cost { font-size: 11px; color: #aaa; margin-top: 4px; }
        .recipe-cost span { margin-right: 8px; }
        .recipe-cost span.insufficient { color: #e74c3c; }

        /* Players List Screen */
        #players-list-screen { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: rgba(30, 30, 30, 0.95); border: 3px solid #444; border-radius: 16px; padding: 14px; display: none; pointer-events: auto; z-index: 10; }
        #players-list-header { color: white; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        #close-players-btn { background: #cc3333; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
        #players-list-content { display: flex; flex-direction: column; gap: 8px; }
        .player-entry { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 6px 10px; border-radius: 6px; color: white; font-size: 14px; }
        .player-entry button { background: #2ecc71; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }

        /* Invite Received Screen */
        #invite-received-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; background: rgba(30, 30, 30, 0.98); border: 3px solid #444; border-radius: 16px; padding: 20px; text-align: center; display: none; pointer-events: auto; z-index: 100; }
        #invite-message { color: white; font-size: 16px; margin-bottom: 15px; }
        #invite-actions { display: flex; justify-content: center; gap: 10px; }
        #accept-invite-btn { background: #2ecc71; color: white; border: none; border-radius: 6px; padding: 8px 15px; font-size: 14px; cursor: pointer; }
        #deny-invite-btn { background: #e74c3c; color: white; border: none; border-radius: 6px; padding: 8px 15px; font-size: 14px; cursor: pointer; }

        /* Registration Screen */
        #registration-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: rgba(30, 30, 30, 0.98); border: 3px solid #444; border-radius: 16px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; z-index: 200; }
        #registration-screen h2 { color: white; margin-bottom: 10px; }
        #registration-screen input { width: calc(100% - 20px); padding: 10px; border-radius: 8px; border: 1px solid #555; background: #1a1a1a; color: white; font-size: 16px; }
        #registration-screen button { background: #3498db; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #registration-screen button:hover { background: #2980b9; }
        #registration-error { color: #e74c3c; font-size: 12px; display: none; }

        #drag-preview { position: absolute; width: 44px; height: 44px; background: rgba(127, 140, 141, 0.6); border: 2px dashed #bdc3c7; border-radius: 8px; pointer-events: none; display: none; z-index: 100; transform: translate(-50%, -50%); }
        #drag-preview .item-icon { width: 100%; height: 100%; border-radius: 6px; }
        #drag-preview .item-count { font-size: 12px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="drag-preview"></div>
    <div id="ui-layer">
        <div id="top-left-ui">
            <div id="restart-button">Restart</div>
            <div id="players-online-button">👥 Online (0)</div>
        </div>

        <div id="status-bars-container">
            <div class="stat-bar" id="hunger-bar" style="position: relative;">
                <div class="stat-fill" style="width: 100%;"></div>
                <span class="stat-bar-label">HUNGER</span>
            </div>
            <div class="stat-bar" id="thirst-bar" style="position: relative;">
                <div class="stat-fill" style="width: 100%;"></div>
                <span class="stat-bar-label">THIRST</span>
            </div>
        </div>

        <div id="status-text">Slot 1 (Hook Tool Selected)</div>
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="hearts-container">
            <span class="heart-icon" id="heart-0">❤️</span>
            <span class="heart-icon" id="heart-1">❤️</span>
            <span class="heart-icon" id="heart-2">❤️</span>
            <span class="heart-icon" id="heart-3">❤️</span>
        </div>
        <div id="action-buttons-stack">
            <div class="hud-btn" id="hand-button"><span class="btn-icon">🖐️</span><span id="hand-button-text">THROW</span></div>
            <div class="hud-btn" id="hammer-button"><span class="btn-icon">🔨</span><span>BUILD</span></div>
            <div class="hud-btn" id="bag-button"><span class="btn-icon">🎒</span><span>BAG</span></div>
        </div>
        <div id="build-controls-overlay">
            <div class="build-btn" id="btn-confirm-build">✓</div>
            <div class="build-btn" id="btn-cancel-build">X</div>
        </div>

        <!-- Inventory Screen -->
        <div id="inventory-screen">
            <div id="inventory-header"><span>Inventory (20 Slots)</span><button id="close-inv-btn">X</button></div>
            <div id="inventory-scroll-container"><div id="inventory-grid"></div></div>
        </div>

        <!-- Crafting Menu Screen -->
        <div id="crafting-menu-screen">
            <div id="crafting-menu-header"><span>Crafting</span><button id="close-craft-btn">X</button></div>
            <div id="crafting-recipes">
                <!-- Recipes will be dynamically inserted here -->
                <div class="craft-recipe" data-recipe="wood_plank" data-craft-location="anywhere">
                    <div class="recipe-output-icon item-icon wood_plank"></div>
                    <div class="recipe-details">
                        <span>Wood Plank</span>
                        <div class="recipe-cost">
                            <span data-cost-item="wood">2 Wood</span>
                        </div>
                    </div>
                </div>
                <div class="craft-recipe" data-recipe="crafting_table" data-craft-location="anywhere">
                    <div class="recipe-output-icon item-icon crafting_table"></div>
                    <div class="recipe-details">
                        <span>Crafting Table</span>
                        <div class="recipe-cost">
                            <span data-cost-item="wood">4 Wood</span>
                            <span data-cost-item="scrap_metal">1 Scrap Metal</span>
                        </div>
                    </div>
                </div>
                <div class="craft-recipe" data-recipe="rope" data-craft-location="crafting_table">
                    <div class="recipe-output-icon item-icon rope"></div>
                    <div class="recipe-details">
                        <span>Rope</span>
                        <div class="recipe-cost">
                            <span data-cost-item="leaf">2 Leaf</span>
                        </div>
                    </div>
                </div>
                <div class="craft-recipe" data-recipe="cup" data-craft-location="crafting_table">
                    <div class="recipe-output-icon item-icon cup"></div>
                    <div class="recipe-details">
                        <span>Cup</span>
                        <div class="recipe-cost">
                            <span data-cost-item="scrap_metal">3 Scrap Metal</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Players List Screen -->
        <div id="players-list-screen">
            <div id="players-list-header"><span>Players Online</span><button id="close-players-btn">X</button></div>
            <div id="players-list-content">
                <!-- Player entries will be dynamically inserted here -->
                <!-- <div class="player-entry">Player 1 <button data-player-id="1">Invite</button></div> -->
            </div>
        </div>

        <!-- Invite Received Screen -->
        <div id="invite-received-screen">
            <div id="invite-message">Player X has invited you to their world!</div>
            <div id="invite-actions">
                <button id="accept-invite-btn">Accept</button>
                <button id="deny-invite-btn">Deny</button>
            </div>
        </div>

        <!-- Registration Screen -->
        <div id="registration-screen">
            <h2>Register Your Character</h2>
            <input type="text" id="character-name-input" placeholder="Enter character name">
            <button id="register-button">Register</button>
            <div id="registration-error"></div>
        </div>

        <div id="hotbar-container"><div class="hotbar" id="hotbar"></div></div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const dragPreview = document.getElementById('drag-preview');
        const dragPreviewIcon = document.createElement('div');
        dragPreviewIcon.className = 'item-icon';
        dragPreview.appendChild(dragPreviewIcon);
        const dragPreviewCount = document.createElement('span');
        dragPreviewCount.className = 'item-count';
        dragPreview.appendChild(dragPreviewCount);

        const TILE_SIZE = 32; 
        const BASE_SPEED = 3.5;

        // Initial states for game variables
        const initialPlayerState = { x: 0, y: 0, width: 24, height: 24, color: '#8B5A2B', eyeColor: '#FFFFFF', pupilColor: '#000000', inWater: false, health: 4, lastBiteTime: 0, hunger: 100, thirst: 100, lastStatDecayTime: 0 };
        const initialSharkState = { x: 0, y: 0, width: 26, height: 26, speed: 2.2, active: false, state: "HIDDEN", timer: 0, offscreenTimer: 0, targetX: 0, targetY: 0, angle: 0, lastWaterExitTime: 0 };
        const initialBuildModeState = { active: false, gridX: 0, gridY: 0, touchX: 0, touchY: 0, isValidPlacement: false, hasEnoughResources: false, buildItemType: 'raft_piece' };
        const initialHotbarItems = [{ type: "hook", count: 1 }, null, null, null, null, null, null, null]; // Use objects for items
        const initialInventoryItems = Array(20).fill(null); // 20 inventory slots
        const initialDragManagerState = { isDragging: false, fromIndex: -1, fromContainer: null, touchId: null, draggedItem: null, dragStartTime: 0 };
        const initialHookToolState = { state: "IDLE", chargeTimer: 0, chargeColor: "yellow", ringRadius: 0, blinkTimer: 0, x: 0, y: 0, startX: 0, startY: 0, targetX: 0, targetY: 0, speed: 7.0, returnSpeed: 2.0, width: 12, height: 12, carriedObject: null };

        let player;
        let shark;
        let buildMode;
        let hotbarItems;
        let inventoryItems;
        let dragManager;
        let hookTool;
        let raftGrid; // Stores objects on the raft, e.g., { type: 'raft_piece', walkable: true } or { type: 'crafting_table', walkable: false }
        let activeSlot;
        let craftingMenuOpen = false;
        let registeredCharacterName = null;
        let onlinePlayers = []; // Simulated online players

        let moveVector = { x: 0, y: 0 }; // Joystick input
        let keyboardMoveVector = { x: 0, y: 0 }; // Keyboard input
        let combinedMoveVector = { x: 0, y: 0 }; // Combined input
        let keysPressed = {}; // To track currently pressed keys

        let oceanObjects = [];
        let oceanObjectSpawnTimer = 0;
        const OCEAN_OBJECT_SPAWN_INTERVAL = 180; // frames
        const OCEAN_OBJECT_TYPES = [
            { type: "wood", color: "#8B4513", width: 20, height: 10, icon: "🪵" },
            { type: "leaf", color: "#228B22", width: 18, height: 18, icon: "🍃" },
            { type: "barrel", color: "#6B4226", width: 30, height: 25, icon: "🛢️", contents: [{ type: "wood", count: 2 }, { type: "leaf", count: 2 }, { type: "scrap_metal", count: 1 }, { type: "potato", count: 1 }] }
        ];

        const ITEM_STACK_LIMITS = {
            "wood": 10,
            "leaf": 10,
            "scrap_metal": 10,
            "potato": 5,
            "wood_plank": 10,
            "rope": 10,
            "cup": 1,
            "cup_filled": 1,
            "hook": 1,
            "crafting_table": 1 // Crafting table is a placed object, not really stackable in inventory
        };

        const CRAFTING_RECIPES = {
            "wood_plank": {
                output: { type: "wood_plank", count: 1 },
                cost: [{ type: "wood", count: 2 }],
                location: "anywhere"
            },
            "crafting_table": {
                output: { type: "crafting_table", count: 1 },
                cost: [{ type: "wood", count: 4 }, { type: "scrap_metal", count: 1 }],
                location: "anywhere"
            },
            "rope": {
                output: { type: "rope", count: 1 },
                cost: [{ type: "leaf", count: 2 }],
                location: "crafting_table"
            },
            "cup": {
                output: { type: "cup", count: 1 },
                cost: [{ type: "scrap_metal", count: 3 }],
                location: "crafting_table"
            }
        };

        const FOOD_ITEMS = ["potato"];
        const DRINK_ITEMS = ["cup", "cup_filled"];

        function getGridKey(gx, gy) { return `${gx},${gy}`; }

        function initRaft() {
            raftGrid[getGridKey(-1, -1)] = { type: 'raft_piece', walkable: true };
            raftGrid[getGridKey(0, -1)] = { type: 'raft_piece', walkable: true };
            raftGrid[getGridKey(-1, 0)] = { type: 'raft_piece', walkable: true };
            raftGrid[getGridKey(0, 0)] = { type: 'raft_piece', walkable: true };
        }

        const hotbarEl = document.getElementById('hotbar');
        const handButton = document.getElementById('hand-button');
        const handButtonText = document.getElementById('hand-button-text');
        
        function renderItemInSlot(slotElement, item) {
            slotElement.innerHTML = "";
            const num = document.createElement('span');
            num.className = 'slot-num';
            num.innerText = slotElement.dataset.index ? (parseInt(slotElement.dataset.index) + 1) : '';
            slotElement.appendChild(num);

            if (item) {
                const icon = document.createElement('div');
                icon.className = `item-icon ${item.type}`;
                icon.innerText = getItemIcon(item.type); // Get specific icon for item type
                slotElement.appendChild(icon);

                if (item.count > 1) {
                    const count = document.createElement('span');
                    count.className = 'item-count';
                    count.innerText = item.count;
                    slotElement.appendChild(count);
                }
            }
        }

        function getItemIcon(type) {
            switch (type) {
                case "hook": return "🎣";
                case "wood": return "🪵";
                case "leaf": return "🍃";
                case "scrap_metal": return "⚙️";
                case "potato": return "🥔";
                case "wood_plank": return " planks"; // Placeholder text for planks
                case "crafting_table": return "🛠️";
                case "rope": return "➰";
                case "cup": return "🥛";
                case "cup_filled": return "💧";
                default: return "❓";
            }
        }

        function renderHotbarUI() {
            hotbarEl.innerHTML = "";
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = `slot ${i === activeSlot ? 'active' : ''}`;
                slot.dataset.index = i;
                slot.dataset.container = 'hotbar';

                renderItemInSlot(slot, hotbarItems[i]);
                
                addDragDropListeners(slot, i, 'hotbar');
                slot.addEventListener('pointerdown', (e) => {
                    if (!dragManager.isDragging) { // Only activate slot if not dragging an item already
                        setActiveSlot(i);
                    }
                });
                hotbarEl.appendChild(slot);
            }
            updateHandButton();
        }

        const invGridEl = document.getElementById('inventory-grid');
        function renderInventorySlots() {
            invGridEl.innerHTML = "";
            for (let j = 0; j < 20; j++) {
                const invSlot = document.createElement('div');
                invSlot.className = 'inv-slot';
                invSlot.dataset.index = j;
                invSlot.dataset.container = 'inventory';

                renderItemInSlot(invSlot, inventoryItems[j]);
                addDragDropListeners(invSlot, j, 'inventory');
                invGridEl.appendChild(invSlot);
            }
        }

        function addDragDropListeners(slotElement, index, containerType) {
            let pressTimer;

            slotElement.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return; // Only left click
                
                // Start timer for drag
                pressTimer = setTimeout(() => {
                    if (containerType === 'hotbar' && !hotbarItems[index]) return;
                    if (containerType === 'inventory' && !inventoryItems[index]) return;

                    dragManager.isDragging = true;
                    dragManager.fromIndex = index;
                    dragManager.fromContainer = containerType;
                    dragManager.touchId = e.pointerId;
                    dragManager.draggedItem = containerType === 'hotbar' ? hotbarItems[index] : inventoryItems[index];

                    dragPreview.style.display = 'block';
                    dragPreview.style.left = e.clientX + 'px';
                    dragPreview.style.top = e.clientY + 'px';
                    dragPreviewIcon.className = `item-icon ${dragManager.draggedItem.type}`;
                    dragPreviewIcon.innerText = getItemIcon(dragManager.draggedItem.type);
                    dragPreviewCount.innerText = dragManager.draggedItem.count > 1 ? dragManager.draggedItem.count : '';
                    
                    slotElement.setPointerCapture(e.pointerId);
                }, 3000); // 3 seconds for drag

                // If not dragging, just activate the slot on quick tap
                if (!dragManager.isDragging) {
                    setActiveSlot(index);
                }
            });

            slotElement.addEventListener('pointermove', (e) => {
                if (dragManager.isDragging && dragManager.touchId === e.pointerId) {
                    dragPreview.style.left = e.clientX + 'px';
                    dragPreview.style.top = e.clientY + 'px';
                }
            });

            slotElement.addEventListener('pointerup', (e) => {
                clearTimeout(pressTimer); // Clear the timer on pointer up

                if (dragManager.isDragging && dragManager.touchId === e.pointerId) {
                    slotElement.releasePointerCapture(e.pointerId);
                    dragPreview.style.display = 'none';
                    
                    const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                    const targetSlot = elemBelow ? elemBelow.closest('.slot, .inv-slot') : null;

                    if (targetSlot) {
                        const toIndex = parseInt(targetSlot.dataset.index);
                        const toContainer = targetSlot.dataset.container;

                        let sourceArray = dragManager.fromContainer === 'hotbar' ? hotbarItems : inventoryItems;
                        let targetArray = toContainer === 'hotbar' ? hotbarItems : inventoryItems;

                        if (sourceArray === targetArray && dragManager.fromIndex === toIndex) {
                            // Dropped on same slot, no change
                        } else {
                            const sourceItem = sourceArray[dragManager.fromIndex];
                            const targetItem = targetArray[toIndex];

                            if (targetItem && sourceItem.type === targetItem.type && targetItem.count < ITEM_STACK_LIMITS[targetItem.type]) {
                                // Stack items
                                const remainingSpace = ITEM_STACK_LIMITS[targetItem.type] - targetItem.count;
                                const transferAmount = Math.min(sourceItem.count, remainingSpace);
                                
                                targetItem.count += transferAmount;
                                sourceItem.count -= transferAmount;

                                if (sourceItem.count <= 0) {
                                    sourceArray[dragManager.fromIndex] = null;
                                }
                            } else {
                                // Swap items
                                sourceArray[dragManager.fromIndex] = targetItem;
                                targetArray[toIndex] = sourceItem;
                            }
                        }
                    } else {
                        // Dropped outside a valid slot, return to original
                    }
                    dragManager.isDragging = false;
                    dragManager.draggedItem = null;
                    renderHotbarUI();
                    renderInventorySlots();
                    setActiveSlot(activeSlot); // Re-activate current slot
                }
            });
        }
        
        // UI Element Selectors
        const restartBtn = document.getElementById('restart-button');
        const playersOnlineBtn = document.getElementById('players-online-button');
        const bagBtn = document.getElementById('bag-button');
        const hammerBtn = document.getElementById('hammer-button');

        const closeInvBtn = document.getElementById('close-inv-btn');
        const buildOverlay = document.getElementById('build-controls-overlay');
        const confirmBuildBtn = document.getElementById('btn-confirm-build');
        const cancelBuildBtn = document.getElementById('btn-cancel-build');
        const craftingMenuScreen = document.getElementById('crafting-menu-screen');
        const closeCraftBtn = document.getElementById('close-craft-btn');
        const craftingRecipesContainer = document.getElementById('crafting-recipes');
        const playersListScreen = document.getElementById('players-list-screen');
        const closePlayersBtn = document.getElementById('close-players-btn');
        const inviteReceivedScreen = document.getElementById('invite-received-screen');
        const acceptInviteBtn = document.getElementById('accept-invite-btn');
        const denyInviteBtn = document.getElementById('deny-invite-btn');

        const characterNameInput = document.getElementById('character-name-input');
        const registerButton = document.getElementById('register-button');

        const playersListContent = document.getElementById('players-list-content');

        restartBtn.addEventListener('pointerdown', (e) => {

        playersOnlineBtn.addEventListener('pointerdown', (e) => {

            }
            if (buildMode.active) exitBuildMode();
            invScreen.style.display = 'none';
            craftingMenuScreen.style.display = 'none';

            if (playersListScreen.style.display === 'block') {
                renderOnlinePlayers();
            }
        });

        registerButton.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            const name = characterNameInput.value.trim();
            if (name.length < 3) {
                registrationError.innerText = "Name must be at least 3 characters.";
                registrationError.style.display = 'block';
                return;
            }
            if (onlinePlayers.some(p => p.name === name)) {
                registrationError.innerText = "Name already taken.";
                registrationError.style.display = 'block';
                return;
            }
            registeredCharacterName = name;
            onlinePlayers.push({ id: Date.now(), name: name }); // Simulate registration
            registrationScreen.style.display = 'none';
            playersOnlineBtn.innerText = `👥 Online (${onlinePlayers.length})`;

        closePlayersBtn.addEventListener('pointerdown', (e) => {

            playersListScreen.style.display = 'none';
        });

            onlinePlayers.forEach(playerEntry => {
                if (playerEntry.name === registeredCharacterName) return; // Don't show self
                const div = document.createElement('div');
                div.className = 'player-entry';
                div.innerHTML = `<span>${playerEntry.name}</span> <button data-player-id="${playerEntry.id}" data-player-name="${playerEntry.name}">Invite</button>`;
                playersListContent.appendChild(div);
            });
        }

        playersListContent.addEventListener('pointerdown', (e) => {

        acceptInviteBtn.addEventListener('pointerdown', (e) => {

        });

        denyInviteBtn.addEventListener('pointerdown', (e) => {

        });

        bagBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (buildMode.active) exitBuildMode();
            craftingMenuScreen.style.display = 'none';
            playersListScreen.style.display = 'none';

        closeInvBtn.addEventListener('pointerdown', (e) => {

        hammerBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            invScreen.style.display = 'none'; 
            playersListScreen.style.display = 'none';
            craftingMenuScreen.style.display = 'none'; // Close crafting menu if open

                exitBuildMode();
            } else {
                enterBuildMode('raft_piece');
            }
        });

        // Event listener for clicking on raft pieces or crafting tables
        canvas.addEventListener('pointerdown', (e) => {
            if (e.target !== canvas) return; // Only process clicks on canvas itself
            if (buildMode.active) return; // Don't interfere with build mode

            const worldClickX = e.clientX - (canvas.width / 2 - player.x);
            const worldClickY = e.clientY - (canvas.height / 2 - player.y);
            const gridX = Math.floor(worldClickX / TILE_SIZE);
            const gridY = Math.floor(worldClickY / TILE_SIZE);
            const clickedKey = getGridKey(gridX, gridY);
            const clickedObject = raftGrid[clickedKey];

            if (clickedObject) {
                const objCenterX = gridX * TILE_SIZE + TILE_SIZE / 2;
                const objCenterY = gridY * TILE_SIZE + TILE_SIZE / 2;
                const dist = Math.sqrt(Math.pow(player.x - objCenterX, 2) + Math.pow(player.y - objCenterY, 2));

                if (dist < TILE_SIZE * 1.5) { // Within 1.5 tiles
                    if (clickedObject.type === 'raft_piece') {
                        enterBuildMode('raft_piece'); // Re-enter build mode for raft pieces
                        buildMode.gridX = gridX; // Start preview near the clicked piece
                        buildMode.gridY = gridY;
                        statusText.innerText = "Build Mode: Place raft pieces.";
                    } else if (clickedObject.type === 'crafting_table') {
                        craftingMenuScreen.style.display = 'block';
