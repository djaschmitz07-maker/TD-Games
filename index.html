                ctx.strokeStyle = '#000'; ctx.lineWidth = ant.type === 'queen' ? 1.8 : 0.8;
                [-1.8, -1.3, -0.9, 0.9, 1.3, 1.8].forEach(ang => {
                    ctx.beginPath(); ctx.moveTo(-1 * scale, 0);
                    let jx = -1 * scale + (3.5 * scale) * Math.cos(ang), jy = (3.5 * scale) * Math.sin(ang);
                    ctx.lineTo(jx, jy); ctx.lineTo(jx + (4 * scale) * Math.cos(ang), jy + (4 * scale) * Math.sin(ang)); ctx.stroke();
                });

                ctx.fillStyle = primaryColor; ctx.beginPath(); ctx.arc(-4.5 * scale, 0, 4.2 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = accentColor; ctx.beginPath(); ctx.arc(-0.8 * scale, 0, 2.3 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = ant.type === 'warrior' ? '#ff3b30' : primaryColor; ctx.beginPath(); ctx.arc(2.2 * scale, 0, (ant.type === 'warrior' ? 2.7 : 2.0) * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                if (ant.type === 'warrior') {
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.9 * currentZoomFactor;
                    ctx.beginPath(); ctx.arc(3.4 * scale, 1 * scale, 1.4 * scale, -Math.PI/2, 0); ctx.stroke();
                    ctx.beginPath(); ctx.arc(3.4 * scale, -1 * scale, 1.4 * scale, 0, Math.PI/2); ctx.stroke();
                }

                if (ant.carryingFood) {
                    ctx.fillStyle = '#ffbd59'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.5 * currentZoomFactor;
                    ctx.beginPath(); ctx.arc(4.2 * scale, 0, 1.6 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                if (ant.carryingEgg) {
                    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b0b5bd'; ctx.lineWidth = 0.5 * currentZoomFactor;
                    ctx.beginPath(); ctx.ellipse(4.2 * scale, 0, 1.7 * scale, 1.2 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
                
                if (ant.hp < ant.maxHp) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx - 8, sy - 12 * currentZoomFactor, 16, 2);
                    ctx.fillStyle = '#00ff66'; ctx.fillRect(sx - 8, sy - 12 * currentZoomFactor, 16 * (ant.hp / ant.maxHp), 2);
                    ctx.restore();
                }
            });

            renderMinimapHUDOverlay();
        }

        function drawHexagonalOutlineShape(cx, cy, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) { let angle = (Math.PI / 3) * i; ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)); }
            ctx.closePath();
        }

        function renderMinimapHUDOverlay() {
            const mSize = 100; const mx = viewWidth - mSize - 20; const my = 20;
            ctx.fillStyle = 'rgba(10, 12, 17, 0.85)'; ctx.fillRect(mx, my, mSize, mSize);
            ctx.strokeStyle = '#45f3ff'; ctx.lineWidth = 1; ctx.strokeRect(mx, my, mSize, mSize);
            const rStep = mSize / totalGridRows; const cStep = mSize / totalGridCols;
            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) {
                    let state = hexMatrixGrid[r][c].state; if (state === 'wall') continue;
                    if (state === 'dirt') ctx.fillStyle = '#6e4a2b';
                    else if (state === 'outside_door') ctx.fillStyle = '#3d291e';
                    else ctx.fillStyle = '#2b1a0f';
                    ctx.fillRect(mx + c * cStep, my + r * rStep, cStep + 0.2, rStep + 0.2);
                }
            }
            let focalGridX = Math.floor(((-viewScrollOffsetX) / currentZoomFactor + viewWidth/2) / (hexRadius * 1.5 * totalGridCols) * mSize);
            let focalGridY = Math.floor(((-viewScrollOffsetY) / currentZoomFactor + viewHeight/2) / (hexRadius * 1.732 * totalGridRows) * mSize);
            ctx.fillStyle = '#ff2a2a'; ctx.fillRect(Math.max(mx, Math.min(mx + mSize - 4, mx + mSize/2 + focalGridX)), Math.max(my, Math.min(my + mSize - 4, my + mSize/2 + focalGridY)), 3, 3);
        }

        function getHexDistance(r1, c1, r2, c2) {
            let x1 = c1, z1 = r1 - (c1 - (c1 & 1)) / 2; let x2 = c2, z2 = r2 - (c2 - (c2 & 1)) / 2;
            return (Math.abs(x1 - x2) + Math.abs(-x1 - z1 + x2 + z2) + Math.abs(z1 - z2)) / 2;
        }

        function runMainSimulationLoop() {
            updateSimulationStateEngine(); drawSimulationFrameContext(); requestAnimationFrame(runMainSimulationLoop);
        }
        window.onload = function() { initializeGameEngine(); };
    </script>
</body>
