<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Colony Simulator - Progressive Build</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Roboto', sans-serif; background-color: #0d0e12; color: #c5c6c7; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #hud-header { background: linear-gradient(180deg, #161920 0%, #090a0f 100%); border-bottom: 2px solid #45f3ff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 243, 255, 0.15); z-index: 10; }
        .hud-title { font-family: 'Orbitron', sans-serif; font-weight: 700; color: #45f3ff; font-size: 1.1rem; letter-spacing: 2px; }
        
        #build-toolbar { display: flex; gap: 8px; margin-left: 20px; }
        .tool-btn { background: #1a1d24; border: 1px solid #364359; color: #94a3b6; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: bold; transition: all 0.2s; }
        .tool-btn:hover { border-color: #45f3ff; color: #fff; }
        .tool-btn.active-tool { background: rgba(0, 243, 255, 0.15); border-color: #45f3ff; color: #45f3ff; box-shadow: 0 0 8px rgba(0, 243, 255, 0.3); }
        .resource-display { font-family: 'Orbitron', sans-serif; font-weight: bold; color: #ffbd59; font-size: 0.95rem; margin-left: auto; margin-right: 25px; text-shadow: 0 0 5px rgba(255, 189, 89, 0.3); }

        .pause-btn { background: #ff2a2a; border: 1px solid #ff4f4f; color: #fff; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: bold; transition: all 0.2s ease; }
        .pause-btn.paused { background: #00ff55; border-color: #33ff77; color: #000; box-shadow: 0 0 10px rgba(0, 255, 85, 0.5); }
        #game-viewport-container { flex: 1; position: relative; overflow: hidden; background-color: #050507; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #110e0c; box-shadow: 0 0 35px rgba(0, 0, 0, 0.9); display: block; }
        #zoom-controls { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 15; }
        .zoom-btn { background: #121620; border: 2px solid #283545; color: #45f3ff; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .zoom-btn:hover { border-color: #ffbd59; background: #1a202c; }
        
        #controls-dashboard { background: #11141d; border-top: 2px solid #45f3ff; padding: 5px 15px; display: flex; gap: 10px; align-items: center; height: 135px; z-index: 10; }
        .pool-card { background: rgba(0, 0, 0, 0.4); border: 1px dashed #45f3ff; border-radius: 6px; padding: 6px; height: 115px; width: 150px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .pool-title { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; color: #45f3ff; text-align: center; letter-spacing: 0.5px; font-weight: bold; }
        .pool-row { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; padding: 2px 8px; background: rgba(255,255,255,0.03); border-radius: 3px; }
        
        .squads-container { display: flex; gap: 6px; flex: 1; height: 115px; }
        .squad-card { background: #161a24; border: 1px solid #252e3b; border-radius: 6px; flex: 1; display: flex; flex-direction: column; padding: 4px 6px; cursor: pointer; transition: all 0.2s ease; position: relative; justify-content: space-between; }
        .squad-card.active-squad { border-color: #45f3ff; background: rgba(0, 243, 255, 0.03); box-shadow: 0 0 8px rgba(0, 243, 255, 0.15); }
        .squad-header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
        .squad-number { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: bold; }
        
        .squad-subrow { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 0.75rem; background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 3px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .squad-tally { font-weight: bold; color: #fff; }
        .squad-btns { display: flex; gap: 2px; }
        .adjust-btn { width: 16px; height: 16px; background: #1f2535; border: 1px solid #364359; color: #c5c6c7; font-size: 0.65rem; font-weight: bold; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .adjust-btn:hover { background: #2b344a; color: #45f3ff; }
        
        .clear-marker-btn { background: #ff3333; border: none; color: white; font-size: 0.55rem; width: 14px; height: 14px; line-height: 14px; text-align: center; border-radius: 3px; cursor: pointer; font-weight: bold; display: none; }
        #pause-screen-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 8; pointer-events: none; }
        .pause-text-banner { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #ff2a2a; font-weight: bold; letter-spacing: 5px; background: rgba(10, 11, 15, 0.95); padding: 15px 40px; border-radius: 6px; border: 2px solid #ff2a2a; box-shadow: 0 0 25px rgba(255, 42, 42, 0.3); }
        #instruction-tooltip { position: absolute; bottom: 15px; left: 20px; background: rgba(18, 22, 32, 0.85); border: 1px solid #2d3748; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-family: 'Orbitron', sans-serif; color: #94a3b6; pointer-events: none; z-index: 15; }
    </style>
    <script>
        let currentZoomFactor = 0.85; let viewScrollOffsetX = 0; let viewScrollOffsetY = 0; let isGamePaused = false;
        window.adjustCameraZoom = function(amount) { currentZoomFactor = Math.max(0.4, Math.min(2.0, currentZoomFactor + amount)); };
        window.togglePauseState = function() {
            isGamePaused = !isGamePaused;
            document.getElementById('btn-pause-toggle').innerText = isGamePaused ? 'RESUME GAME' : 'PAUSE GAME';
            document.getElementById('btn-pause-toggle').className = isGamePaused ? 'pause-btn paused' : 'pause-btn';
            document.getElementById('pause-screen-overlay').style.display = isGamePaused ? 'flex' : 'none';
        };
    </script>
</head>
<body>
    <div id="hud-header">
        <div class="hud-title">EMPIRES OF THE UNDERGROWTH</div>
        <div id="build-toolbar">
            <button id="tool-worker_nest" class="tool-btn" onclick="window.setSelectTool('worker_nest')">🥚 WORKER CELL (20)</button>
            <button id="tool-warrior_nest" class="tool-btn" onclick="window.setSelectTool('warrior_nest')">⚔️ WARRIOR CELL (30)</button>
            <button id="tool-food_cell" class="tool-btn" onclick="window.setSelectTool('food_cell')">🍗 FOOD CELL (10)</button>
            <button id="tool-speed_cell" class="tool-btn" onclick="window.setSelectTool('speed_cell')">⚡ SPEED CELL (5)</button>
        </div>
        <div class="resource-display">🍂 FOOD: <span id="food-current-value">0</span> / <span id="food-max-value">300</span></div>
        <button id="btn-pause-toggle" class="pause-btn" onclick="window.togglePauseState()">PAUSE GAME</button>
    </div>
    <div id="game-viewport-container">
        <div id="zoom-controls">
            <button class="zoom-btn" onclick="window.adjustCameraZoom(0.15)">+</button>
            <button class="zoom-btn" onclick="window.adjustCameraZoom(-0.15)">−</button>
        </div>
        <div id="instruction-tooltip">⚡ Speed cells online! Ants sprint twice as fast while trailing across neon speed corridors.</div>
        <canvas id="nestCanvas"></canvas>
        <div id="pause-screen-overlay"><div class="pause-text-banner">SIMULATION PAUSED</div></div>
    </div>
    <div id="controls-dashboard">
        <div class="pool-card">
            <div class="pool-title">👑 ROYAL HOME POOL</div>
            <div class="pool-row"><span>WKR:</span><span id="pool-wkr-value">5</span></div>
            <div class="pool-row"><span>WAR:</span><span id="pool-war-value">0</span></div>
        </div>
        <div class="squads-container" id="squads-container-row"></div>
    </div>

    <script>
        const canvas = document.getElementById('nestCanvas'); const ctx = canvas.getContext('2d');
        let activelySelectedSquad = null; const viewWidth = 800; const viewHeight = 600; const hexRadius = 11;
        const totalGridRows = 45; const totalGridCols = 45; let hexMatrixGrid = []; let antEntitiesList = [];
        let markedMiningTasks = []; let isMouseButtonDown = false; let dragBrushMode = null;
        let groupRallyPoints = {1: null, 2: null, 3: null, 4: null, 5: null, 6: null};
        const groupColorHexes = {1: '#00ff66', 2: '#0088ff', 3: '#ff9900', 4: '#cc00ff', 5: '#ff33aa', 6: '#00ffff'};

        let activeConstructionTool = null; let foodStockpile = 0; 
        const toolCosts = { 'worker_nest': 20, 'warrior_nest': 30, 'food_cell': 10, 'speed_cell': 5 };
        const walkableStates = ['open', 'blueprint', 'worker_nest', 'warrior_nest', 'food_cell', 'speed_cell'];
        let looseFoodItems = [];

        // Generate Management Cards
        const dashboardRow = document.getElementById('squads-container-row');
        for (let idx = 1; idx <= 6; idx++) {
            let container = document.createElement('div');
            container.className = 'squad-card';
            container.id = 'squad-card-' + idx;
            container.setAttribute('onclick', `window.selectActiveSquadControl(${idx})`);
            container.innerHTML = `
                <div class="squad-header">
                    <div class="squad-number" style="color:${groupColorHexes[idx]}">G${idx}</div>
                    <button id="clear-marker-btn-${idx}" class="clear-marker-btn" onclick="window.removeSquadRallyFlag(event, ${idx})">✕</button>
                </div>
                <div class="squad-subrow">
                    <span>🥚 W:</span>
                    <span class="squad-tally" id="squad-wkr-value-${idx}">0</span>
                    <div class="squad-btns">
                        <button class="adjust-btn" onclick="window.reallocateAntUnit(event, ${idx}, 1, 'worker')">+</button>
                        <button class="adjust-btn" onclick="window.reallocateAntUnit(event, ${idx}, -1, 'worker')">-</button>
                    </div>
                </div>
                <div class="squad-subrow">
                    <span>⚔️ W:</span>
                    <span class="squad-tally" id="squad-war-value-${idx}">0</span>
                    <div class="squad-btns">
                        <button class="adjust-btn" onclick="window.reallocateAntUnit(event, ${idx}, 1, 'warrior')">+</button>
                        <button class="adjust-btn" onclick="window.reallocateAntUnit(event, ${idx}, -1, 'warrior')">-</button>
                    </div>
                </div>`;
            dashboardRow.appendChild(container);
        }

        window.setSelectTool = function(toolName) {
            if (activeConstructionTool === toolName) { activeConstructionTool = null; } 
            else {
                activeConstructionTool = toolName; activelySelectedSquad = null;
                for (let i = 1; i <= 6; i++) { document.getElementById('squad-card-' + i).classList.remove('active-squad'); }
            }
            ['tool-worker_nest', 'tool-warrior_nest', 'tool-food_cell', 'tool-speed_cell'].forEach(t => {
                const btn = document.getElementById(t);
                if (btn) btn.classList.toggle('active-tool', t === 'tool-' + activeConstructionTool);
            });
        };

        window.selectActiveSquadControl = function(squadNum) {
            if (activelySelectedSquad === squadNum) { activelySelectedSquad = null; } 
            else {
                activelySelectedSquad = squadNum; activeConstructionTool = null;
                ['tool-worker_nest', 'tool-warrior_nest', 'tool-food_cell', 'tool-speed_cell'].forEach(t => {
                    const btn = document.getElementById(t); if (btn) btn.classList.remove('active-tool');
                });
            }
            for (let i = 1; i <= 6; i++) {
                document.getElementById('squad-card-' + i).classList.toggle('active-squad', i === activelySelectedSquad);
            }
        };

        window.removeSquadRallyFlag = function(event, squadNum) {
            event.stopPropagation(); groupRallyPoints[squadNum] = null;
            document.getElementById(`clear-marker-btn-${squadNum}`).style.display = 'none';
            antEntitiesList.forEach(ant => {
                if (ant.group === squadNum) { ant.path = null; ant.state = 'idle'; ant.targetFoodRef = null; ant.targetEggCell = null; ant.carryingEgg = false; }
            });
            refreshDashboardCounters();
        };

        window.reallocateAntUnit = function(event, squadNum, direction, antType) {
            event.stopPropagation();
            if (direction === 1) {
                let unassignedAnt = antEntitiesList.find(a => a.type === antType && a.group === 0 && !a.pendingGroup);
                if (unassignedAnt) {
                    if (unassignedAnt.state === 'digging' || unassignedAnt.state === 'building' || unassignedAnt.state === 'fetching_egg' || unassignedAnt.state === 'delivering_egg') { unassignedAnt.pendingGroup = squadNum; } 
                    else { unassignedAnt.group = squadNum; unassignedAnt.path = null; unassignedAnt.state = 'idle'; unassignedAnt.targetFoodRef = null; }
                }
            } else {
                let pendingAnt = antEntitiesList.find(a => a.type === antType && a.pendingGroup === squadNum);
                if (pendingAnt) { pendingAnt.pendingGroup = null; } 
                else {
                    let assignedAnt = antEntitiesList.find(a => a.type === antType && a.group === squadNum);
                    if (assignedAnt) { assignedAnt.group = 0; assignedAnt.path = null; assignedAnt.state = 'idle'; assignedAnt.targetFoodRef = null; }
                }
            }
            refreshDashboardCounters();
        };

        function refreshDashboardCounters() {
            let poolWkr = 0, poolWar = 0; let squadCounters = {};
            for(let i=1; i<=6; i++) squadCounters[i] = { worker: 0, warrior: 0 };

            antEntitiesList.forEach(a => {
                if (a.type === 'queen') return;
                let activeGroup = a.pendingGroup ? a.pendingGroup : a.group;
                if (activeGroup === 0) {
                    if (a.type === 'worker') poolWkr++;
                    if (a.type === 'warrior') poolWar++;
                } else {
                    if (a.type === 'worker') squadCounters[activeGroup].worker++;
                    if (a.type === 'warrior') squadCounters[activeGroup].warrior++;
                }
            });

            document.getElementById('pool-wkr-value').innerText = poolWkr;
            document.getElementById('pool-war-value').innerText = poolWar;
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`squad-wkr-value-${i}`).innerText = squadCounters[i].worker;
                document.getElementById(`squad-war-value-${i}`).innerText = squadCounters[i].warrior;
            }
            updateFoodDisplayHUD();
        }

        function calculateMaxFoodCapacity() {
            let count = 0;
            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) { if (hexMatrixGrid[r][c].state === 'food_cell') count++; }
            }
            return count * 50;
        }

        function updateFoodDisplayHUD() {
            document.getElementById('food-current-value').innerText = foodStockpile;
            document.getElementById('food-max-value').innerText = calculateMaxFoodCapacity();
        }

        function getCanvasMouseCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (viewWidth / rect.width),
                y: (e.clientY - rect.top) * (viewHeight / rect.height)
            };
        }

        function calculateHexUnscaledCenter(r, c) {
            let x = c * hexRadius * 1.5; let y = r * hexRadius * 1.73205;
            if (c % 2 === 1) y += (hexRadius * 1.73205) / 2;
            const mapW = totalGridCols * hexRadius * 1.5; const mapH = totalGridRows * hexRadius * 1.73205;
            return { x: x + (viewWidth - mapW) / 2, y: y + (viewHeight - mapH) / 2 };
        }

        function getHexCoordinatesFromWorldPosition(sx, sy) {
            let mapSpaceX = (sx - viewScrollOffsetX - viewWidth / 2) / currentZoomFactor + viewWidth / 2;
            let mapSpaceY = (sy - viewScrollOffsetY - viewHeight / 2) / currentZoomFactor + viewHeight / 2;
            let mapOriginX = (viewWidth - (totalGridCols * hexRadius * 1.5)) / 2;
            let mapOriginY = (viewHeight - (totalGridRows * hexRadius * 1.73205)) / 2;
            let c = Math.round((mapSpaceX - mapOriginX) / (hexRadius * 1.5));
            let r = Math.round((mapSpaceY - mapOriginY - (c % 2 === 1 ? (hexRadius * 1.73205) / 2 : 0)) / (hexRadius * 1.73205));
            if (r >= 0 && r < totalGridRows && c >= 0 && c < totalGridCols) return hexMatrixGrid[r][c];
            return null;
        }

        function getHexNeighbors(r, c) {
            let set = [ {row: r - 1, col: c}, {row: r + 1, col: c}, {row: r, col: c - 1}, {row: r, col: c + 1} ];
            if (c % 2 === 0) set.push({row: r - 1, col: c - 1}, {row: r - 1, col: c + 1});
            else set.push({row: r + 1, col: c - 1}, {row: r + 1, col: c + 1});
            return set.filter(n => n.row >= 0 && n.row < totalGridRows && n.col >= 0 && n.col < totalGridCols);
        }

        function evaluateTilePassableState(r, c) {
            if (walkableStates.includes(hexMatrixGrid[r][c].state)) return true;
            return looseFoodItems.some(f => f.row === r && f.col === c);
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.evaluateTilePassableState = evaluateTilePassableState;
        });

        function computeHexGridPath(startR, startC, endR, endC) {
            if (startR === endR && startC === endC) return [];
            let queue = [[startR, startC]]; let parentMap = {}; parentMap[`${startR},${startC}`] = null; let pathFound = false;

            while (queue.length > 0) {
                let [currR, currC] = queue.shift(); if (currR === endR && currC === endC) { pathFound = true; break; }
                let adjoin = getHexNeighbors(currR, currC);
                for (let i = 0; i < adjoin.length; i++) {
                    let n = adjoin[i]; let nodeKey = `${n.row},${n.col}`;
                    if (evaluateTilePassableState(n.row, n.col) && !(nodeKey in parentMap)) {
                        parentMap[nodeKey] = [currR, currC]; queue.push([n.row, n.col]);
                    }
                }
            }
            if (!pathFound) return null;
            let finalPath = []; let step = [endR, endC];
            while (step !== null) { finalPath.push({r: step[0], c: step[1]}); step = parentMap[`${step[0]},${step[1]}`]; }
            return finalPath.reverse();
        }

        function getPathToAdjacentWalkableTile(startR, startC, targetR, targetC) {
            if (getHexNeighbors(targetR, targetC).some(n => n.row === startR && n.col === startC)) return [];
            let options = getHexNeighbors(targetR, targetC).filter(n => evaluateTilePassableState(n.row, n.col));
            let shortestLen = 999999; let idealPath = null;
            options.forEach(n => {
                let p = computeHexGridPath(startR, startC, n.row, n.col);
                if (p && p.length < shortestLen) { shortestLen = p.length; idealPath = p; }
            });
            return idealPath;
        }

        function verifyExcavationAdjacencyConstraint(tile) {
            if (!tile || tile.state !== 'dirt') return false;
            let perimeter = getHexNeighbors(tile.row, tile.col);
            return perimeter.some(n => evaluateTilePassableState(n.row, n.col)) || markedMiningTasks.some(t => perimeter.some(n => n.row === t.row && n.col === t.col));
        }

        function initializeGameEngine() {
            const midRow = 22; const midCol = 22;
            for (let r = 0; r < totalGridRows; r++) {
                hexMatrixGrid[r] = [];
                for (let c = 0; c < totalGridCols; c++) {
                    let tileState = (r === 0 || r === totalGridRows - 1 || c === 0 || c === totalGridCols - 1) ? 'wall' : 'dirt';
                    if (r === midRow && c === midCol) tileState = 'open';
                    hexMatrixGrid[r][c] = { 
                        row: r, col: c, state: tileState, blueprintType: null, 
                        assignedAntId: null, buildProgress: 0, isMysteryFood: false,
                        eggStatus: 'none', eggProgress: 0, spawnedAntId: null, assignedEggCarrierId: null
                    };
                }
            }

            for (let k = 0; k < 8; k++) {
                let rR = Math.floor(Math.random() * (totalGridRows - 6)) + 3;
                let rC = Math.floor(Math.random() * (totalGridCols - 6)) + 3;
                if (hexMatrixGrid[rR][rC].state === 'dirt' && getHexDistance(rR, rC, midRow, midCol) > 5) {
                    hexMatrixGrid[rR][rC].isMysteryFood = true;
                }
            }

            let perimeterChamber = getHexNeighbors(midRow, midCol);
            perimeterChamber.forEach(n => { hexMatrixGrid[n.row][n.col].state = 'food_cell'; });

            const qPos = calculateHexUnscaledCenter(midRow, midCol);
            antEntitiesList.push({ id: 'queen', type: 'queen', row: midRow, col: midCol, x: qPos.x, y: qPos.y, angle: 0, group: 0 });

            for (let idx = 0; idx < 5; idx++) {
                let cell = perimeterChamber[Math.min(idx, perimeterChamber.length - 1)];
                let p = calculateHexUnscaledCenter(cell.row, cell.col);
                antEntitiesList.push({
                    id: 'worker_' + idx + '_' + Math.floor(Math.random() * 1000), type: 'worker', group: 0, pendingGroup: null,
                    x: p.x, y: p.y, row: cell.row, col: cell.col, angle: Math.random() * Math.PI * 2, speed: 0.375, 
                    state: 'idle', path: null, pathIndex: 0, activeDigTarget: null, activeBuildTarget: null, targetFoodRef: null, 
                    carryingFood: false, targetEggCell: null, carryingEgg: false, buildProgress: 0,
                    spawnTileRow: cell.row, spawnTileCol: cell.col
                });
            }

            window.addEventListener('keydown', e => {
                if (e.key >= '1' && e.key <= '6') window.selectActiveSquadControl(parseInt(e.key));
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault(); const pSpeed = 40;
                    if (e.key === 'ArrowUp') viewScrollOffsetY += pSpeed; if (e.key === 'ArrowDown') viewScrollOffsetY -= pSpeed;
                    if (e.key === 'ArrowLeft') viewScrollOffsetX += pSpeed; if (e.key === 'ArrowRight') viewScrollOffsetX -= pSpeed;
                }
            });

            canvas.addEventListener('mousedown', e => {
                if (isGamePaused) return; const mouse = getCanvasMouseCoords(e);
                let cell = getHexCoordinatesFromWorldPosition(mouse.x, mouse.y); if (!cell) return;
                
                if (cell.state === 'dirt') {
                    isMouseButtonDown = true; 
                    let matchIdx = markedMiningTasks.findIndex(t => t.row === cell.row && t.col === cell.col);
                    if (matchIdx !== -1) { markedMiningTasks.splice(matchIdx, 1); dragBrushMode = 'dehighlight'; }
                    else if (verifyExcavationAdjacencyConstraint(cell)) { markedMiningTasks.push(cell); dragBrushMode = 'highlight'; }
                } else if (evaluateTilePassableState(cell.row, cell.col)) {
                    if (activeConstructionTool) {
                        isMouseButtonDown = true;
                        if (cell.state === 'blueprint' && cell.blueprintType === activeConstructionTool) {
                            foodStockpile += toolCosts[activeConstructionTool]; updateFoodDisplayHUD();
                            if (cell.assignedAntId) {
                                let worker = antEntitiesList.find(a => a.id === cell.assignedAntId);
                                if (worker) { worker.activeBuildTarget = null; worker.state = 'idle'; worker.path = null; }
                            }
                            cell.state = 'open'; cell.blueprintType = null; cell.assignedAntId = null;
                            dragBrushMode = 'erase_blueprint';
                        } else if (cell.state === 'open') {
                            const cost = toolCosts[activeConstructionTool];
                            if (foodStockpile >= cost) {
                                foodStockpile -= cost; updateFoodDisplayHUD();
                                cell.state = 'blueprint'; cell.blueprintType = activeConstructionTool; cell.assignedAntId = null; cell.buildProgress = 0;
                                dragBrushMode = 'place_blueprint';
                            }
                        }
                    } else if (activelySelectedSquad) {
                        groupRallyPoints[activelySelectedSquad] = { row: cell.row, col: cell.col };
                        document.getElementById(`clear-marker-btn-${activelySelectedSquad}`).style.display = 'block';
                        antEntitiesList.forEach(a => { if (a.group === activelySelectedSquad) { a.path = null; a.state = 'idle'; a.targetFoodRef = null; } });
                    }
                }
            });

            canvas.addEventListener('mousemove', e => {
                if (!isMouseButtonDown || isGamePaused || !dragBrushMode) return;
                const mouse = getCanvasMouseCoords(e);
                let cell = getHexCoordinatesFromWorldPosition(mouse.x, mouse.y); if (!cell) return;

                if (cell.state === 'dirt') {
                    let matchIdx = markedMiningTasks.findIndex(t => t.row === cell.row && t.col === cell.col);
                    if (dragBrushMode === 'highlight' && matchIdx === -1) {
                        if (verifyExcavationAdjacencyConstraint(cell)) { markedMiningTasks.push(cell); }
                    } else if (dragBrushMode === 'dehighlight' && matchIdx !== -1) {
                        markedMiningTasks.splice(matchIdx, 1);
                    }
                } else if (activeConstructionTool) {
                    if (dragBrushMode === 'place_blueprint' && cell.state === 'open') {
                        const cost = toolCosts[activeConstructionTool];
                        if (foodStockpile >= cost) {
                            foodStockpile -= cost; updateFoodDisplayHUD();
                            cell.state = 'blueprint'; cell.blueprintType = activeConstructionTool; cell.assignedAntId = null; cell.buildProgress = 0;
                        }
                    } else if (dragBrushMode === 'erase_blueprint' && cell.state === 'blueprint' && cell.blueprintType === activeConstructionTool) {
                        foodStockpile += toolCosts[activeConstructionTool]; updateFoodDisplayHUD();
                        if (cell.assignedAntId) {
                            let worker = antEntitiesList.find(a => a.id === cell.assignedAntId);
                            if (worker) { worker.activeBuildTarget = null; worker.state = 'idle'; worker.path = null; }
                        }
                        cell.state = 'open'; cell.blueprintType = null; cell.assignedAntId = null;
                    }
                }
            });

            const stopDraggingHandler = () => { isMouseButtonDown = false; dragBrushMode = null; };
            canvas.addEventListener('mouseup', stopDraggingHandler);
            canvas.addEventListener('mouseleave', stopDraggingHandler);

            canvas.width = viewWidth; canvas.height = viewHeight;
            refreshDashboardCounters(); runMainSimulationLoop();
        }

        function hatchAntFromCell(cell) {
            let sPos = calculateHexUnscaledCenter(cell.row, cell.col);
            let newId = cell.state + '_spawn_' + Math.floor(Math.random() * 999999);
            cell.spawnedAntId = newId;
            cell.eggStatus = 'none';
            cell.eggProgress = 0;
            
            if (cell.state === 'worker_nest') {
                antEntitiesList.push({
                    id: newId, type: 'worker', group: 0, pendingGroup: null,
                    x: sPos.x, y: sPos.y, row: cell.row, col: cell.col, angle: Math.random() * Math.PI * 2, speed: 0.375, 
                    state: 'idle', path: null, pathIndex: 0, activeDigTarget: null, activeBuildTarget: null, targetFoodRef: null, 
                    carryingFood: false, targetEggCell: null, carryingEgg: false, buildProgress: 0,
                    spawnTileRow: cell.row, spawnTileCol: cell.col
                });
            } else if (cell.state === 'warrior_nest') {
                antEntitiesList.push({
                    id: newId, type: 'warrior', group: 0, pendingGroup: null,
                    x: sPos.x, y: sPos.y, row: cell.row, col: cell.col, angle: Math.random() * Math.PI * 2, speed: 0.375, 
                    state: 'idle', path: null, pathIndex: 0, targetFoodRef: null, carryingFood: false,
                    targetEggCell: null, carryingEgg: false, spawnTileRow: cell.row, spawnTileCol: cell.col
                });
            }
            refreshDashboardCounters();
        }

        function updateSimulationStateEngine() {
            if (isGamePaused) return;

            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) {
                    let cell = hexMatrixGrid[r][c];
                    if (cell.state === 'worker_nest' || cell.state === 'warrior_nest') {
                        if (cell.spawnedAntId) {
                            let liveAntExists = antEntitiesList.some(a => a.id === cell.spawnedAntId);
                            if (!liveAntExists) { cell.spawnedAntId = null; }
                        }
                        if (cell.eggStatus === 'ready' && !cell.spawnedAntId) {
                            hatchAntFromCell(cell);
                        }
                    }
                }
            }

            let globalOpenBlueprints = [];
            let needyEggCells = [];

            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) {
                    let cell = hexMatrixGrid[r][c];
                    if (cell.state === 'blueprint' && !cell.assignedAntId) {
                        globalOpenBlueprints.push(cell);
                    }
                    if ((cell.state === 'worker_nest' || cell.state === 'warrior_nest') && cell.eggStatus === 'none' && !cell.assignedEggCarrierId) {
                        needyEggCells.push(cell);
                    }
                }
            }
            
            let availableLooseFood = looseFoodItems.filter(f => !f.assignedAntId);
            let globalWorkExists = globalOpenBlueprints.length > 0 || (availableLooseFood.length > 0 && foodStockpile < calculateMaxFoodCapacity()) || markedMiningTasks.length > 0 || needyEggCells.length > 0;

            antEntitiesList.forEach(ant => {
                if (ant.type === 'queen') return;

                let activeRallyPoint = ant.group > 0 ? groupRallyPoints[ant.group] : null;

                if (ant.group > 0 && activeRallyPoint && (ant.state === 'fetching_egg' || ant.state === 'delivering_egg')) {
                    if (ant.targetEggCell) ant.targetEggCell.assignedEggCarrierId = null;
                    ant.targetEggCell = null; ant.carryingEgg = false; ant.state = 'idle'; ant.path = null;
                }

                let headingHomeToQueen = !ant.activeDigTarget && !ant.activeBuildTarget && !ant.targetFoodRef && !ant.carryingFood && !ant.targetEggCell;
                if (ant.state === 'marching' && headingHomeToQueen && globalWorkExists && !activeRallyPoint) {
                    ant.path = null; ant.state = 'idle';
                }

                if (ant.carryingFood && foodStockpile >= calculateMaxFoodCapacity()) {
                    ant.carryingFood = false; ant.state = 'idle'; ant.path = null;
                    looseFoodItems.push({
                        id: 'food_dropped_' + Math.floor(Math.random() * 999999), row: ant.row, col: ant.col,
                        x: ant.x, y: ant.y, assignedAntId: null
                    });
                }

                if (activeRallyPoint && !ant.carryingFood && ant.state !== 'digging' && ant.state !== 'building') {
                    let needsNewPath = false;
                    if (ant.state === 'idle') { needsNewPath = true; } 
                    else if (ant.path && ant.path.length > 0) {
                        let finalDest = ant.path[ant.path.length - 1];
                        if (finalDest.r !== activeRallyPoint.row || finalDest.c !== activeRallyPoint.col) { needsNewPath = true; }
                    } else if (!ant.path) { needsNewPath = true; }

                    if (needsNewPath && getHexDistance(ant.row, ant.col, activeRallyPoint.row, activeRallyPoint.col) > 3) {
                        let route = computeHexGridPath(ant.row, ant.col, activeRallyPoint.row, activeRallyPoint.col);
                        if (route && route.length > 0) { 
                            ant.path = route; ant.pathIndex = 0; ant.state = 'marching'; 
                            ant.activeDigTarget = null; ant.activeBuildTarget = null; ant.targetFoodRef = null;
                        }
                    }
                }

                const isAvailableForWork = (ant.group === 0 || !activeRallyPoint);

                if (ant.state === 'fetching_egg') {
                    if (!ant.path) {
                        let route = computeHexGridPath(ant.row, ant.col, 22, 22);
                        if (route) { ant.path = route; ant.pathIndex = 0; } 
                        else {
                            if (ant.targetEggCell) ant.targetEggCell.assignedEggCarrierId = null;
                            ant.targetEggCell = null; ant.state = 'idle';
                        }
                    }
                }
                if (ant.state === 'delivering_egg') {
                    if (!ant.path && ant.targetEggCell) {
                        let route = computeHexGridPath(ant.row, ant.col, ant.targetEggCell.row, ant.targetEggCell.col);
                        if (route) { ant.path = route; ant.pathIndex = 0; } 
                        else {
                            ant.targetEggCell.assignedEggCarrierId = null;
                            ant.targetEggCell = null; ant.state = 'idle'; ant.carryingEgg = false;
                        }
                    }
                }

                if (ant.state === 'idle') {
                    let highPriorityTargets = [];

                    // WARRIOR HOME DEFENSE SECURITY DETACHMENT ARCHITECTURE GATES
                    // Warriors in the Royal Home Pool (Group 0) bypass foraging entirely to stay exclusively on security duty.
                    if (foodStockpile < calculateMaxFoodCapacity() && (ant.type === 'worker' || ant.group > 0)) {
                        let maxFoodDist = (ant.group > 0 && activeRallyPoint) ? 3 : 999999;
                        let openFood = looseFoodItems.filter(f => !f.assignedAntId);
                        if (maxFoodDist === 3) openFood = openFood.filter(f => getHexDistance(ant.row, ant.col, f.row, f.col) <= 3);
                        openFood.forEach(f => {
                            highPriorityTargets.push({ type: 'food', target: f, dist: getHexDistance(ant.row, ant.col, f.row, f.col) });
                        });
                    }

                    if (isAvailableForWork && ant.type === 'worker') {
                        let openBPs = globalOpenBlueprints.filter(bp => !bp.assignedAntId);
                        openBPs.forEach(bp => {
                            highPriorityTargets.push({ type: 'blueprint', target: bp, dist: getHexDistance(ant.row, ant.col, bp.row, bp.col) });
                        });
                        let openEggs = needyEggCells.filter(cell => !cell.assignedEggCarrierId);
                        openEggs.forEach(cell => {
                            highPriorityTargets.push({ type: 'egg_need', target: cell, dist: getHexDistance(ant.row, ant.col, cell.row, cell.col) });
                        });
                    }

                    if (highPriorityTargets.length > 0) {
                        highPriorityTargets.sort((a, b) => a.dist - b.dist);
                        let chosen = highPriorityTargets[0];

                        if (chosen.type === 'food' && !chosen.target.assignedAntId) {
                            let targetFood = chosen.target;
                            let route = computeHexGridPath(ant.row, ant.col, targetFood.row, targetFood.col);
                            if (route) {
                                targetFood.assignedAntId = ant.id; ant.targetFoodRef = targetFood;
                                if (route.length === 0) {
                                    looseFoodItems = looseFoodItems.filter(f => f.id !== targetFood.id);
                                    ant.targetFoodRef = null; ant.carryingFood = true;
                                    routeFoodPelletHome(ant);
                                } else {
                                    ant.path = route; ant.pathIndex = 0; ant.state = 'marching';
                                    ant.activeDigTarget = null; ant.activeBuildTarget = null;
                                }
                                return;
                            }
                        } else if (chosen.type === 'blueprint' && !chosen.target.assignedAntId) {
                            let targetBP = chosen.target;
                            let route = computeHexGridPath(ant.row, ant.col, targetBP.row, targetBP.col);
                            if (route) {
                                targetBP.assignedAntId = ant.id; ant.activeBuildTarget = targetBP;
                                if (route.length === 0) { ant.path = null; ant.state = 'building'; ant.buildProgress = 0; } 
                                else { ant.path = route; ant.pathIndex = 0; ant.state = 'marching'; }
                                return;
                            }
                        } else if (chosen.type === 'egg_need' && !chosen.target.assignedEggCarrierId) {
                            let targetCell = chosen.target;
                            let route = computeHexGridPath(ant.row, ant.col, 22, 22);
                            if (route) {
                                targetCell.assignedEggCarrierId = ant.id; ant.targetEggCell = targetCell; ant.state = 'fetching_egg';
                                if (route.length === 0) {
                                    ant.carryingEgg = true; ant.state = 'delivering_egg';
                                    let delivRoute = computeHexGridPath(ant.row, ant.col, targetCell.row, targetCell.col);
                                    if (delivRoute) { ant.path = delivRoute; ant.pathIndex = 0; } 
                                    else { targetCell.assignedEggCarrierId = null; ant.targetEggCell = null; ant.state = 'idle'; ant.carryingEgg = false; }
                                } else { ant.path = route; ant.pathIndex = 0; }
                                return;
                            }
                        }
                    }

                    if (isAvailableForWork && ant.type === 'worker' && markedMiningTasks.length > 0) {
                        let tasksWithDist = markedMiningTasks.map(t => ({ task: t, dist: getHexDistance(ant.row, ant.col, t.row, t.col) }));
                        tasksWithDist.sort((a, b) => a.dist - b.dist);
                        let minDist = tasksWithDist[0].dist; let candidates = tasksWithDist.filter(t => t.dist === minDist);
                        let chosenTask = candidates[Math.floor(Math.random() * candidates.length)].task;
                        
                        let route = getPathToAdjacentWalkableTile(ant.row, ant.col, chosenTask.row, chosenTask.col);
                        if (route) {
                            ant.activeDigTarget = chosenTask;
                            if (route.length === 0) { ant.path = null; ant.state = 'digging'; ant.digProgress = 0; } 
                            else { ant.path = route; ant.pathIndex = 0; ant.state = 'marching'; }
                            return;
                        }
                    }

                    // Strict Home Fallback Verification For Royal Pool Security Sentinels
                    let homeR = 22, homeC = 22;
                    let shouldGoHome = !globalWorkExists || (ant.group > 0 && groupRallyPoints[ant.group]) || (ant.type === 'warrior' && ant.group === 0);
                    
                    if (ant.group > 0 && groupRallyPoints[ant.group]) { homeR = groupRallyPoints[ant.group].row; homeC = groupRallyPoints[ant.group].col; }
                    
                    if (shouldGoHome && getHexDistance(ant.row, ant.col, homeR, homeC) > 2) {
                        let homeRoute = computeHexGridPath(ant.row, ant.col, homeR, homeC);
                        if (homeRoute && homeRoute.length > 0) { ant.path = homeRoute; ant.pathIndex = 0; ant.state = 'marching'; return; }
                    }
                }

                if (ant.path && ant.path.length > 0) {
                    if (ant.pathIndex < ant.path.length) {
                        let dest = ant.path[ant.pathIndex];
                        if (!evaluateTilePassableState(dest.r, dest.c)) { 
                            ant.path = null; ant.state = 'idle'; 
                            if (ant.targetFoodRef) { ant.targetFoodRef.assignedAntId = null; ant.targetFoodRef = null; }
                            if (ant.targetEggCell) { ant.targetEggCell.assignedEggCarrierId = null; ant.targetEggCell = null; ant.carryingEgg = false; }
                            return; 
                        }

                        let nCenter = calculateHexUnscaledCenter(dest.r, dest.c); let distLeft = Math.hypot(nCenter.x - ant.x, nCenter.y - ant.y);
                        
                        let sepVectorX = 0, sepVectorY = 0; let proximateNeighbors = 0;
                        antEntitiesList.forEach(otherAnt => {
                            if (otherAnt.id !== ant.id && otherAnt.type !== 'queen') {
                                let separationDistance = Math.hypot(otherAnt.x - ant.x, otherAnt.y - ant.y);
                                if (separationDistance > 0 && separationDistance < 10) {
                                    sepVectorX += (ant.x - otherAnt.x) / separationDistance;
                                    sepVectorY += (ant.y - otherAnt.y) / separationDistance;
                                    proximateNeighbors++;
                                }
                            }
                        });

                        // ⚡ DYNAMIC SPEED CELL INFRASTRUCTURE INTEGRATION
                        let currentTileHexNode = hexMatrixGrid[ant.row][ant.col];
                        let activeSpeedMultiplier = (currentTileHexNode && currentTileHexNode.state === 'speed_cell') ? 2.0 : 1.0;
                        let updatedKinematicVelocity = ant.speed * activeSpeedMultiplier;
                        
                        if (proximateNeighbors > 0) { updatedKinematicVelocity *= 0.75; }

                        if (distLeft > updatedKinematicVelocity) {
                            ant.angle = Math.atan2(nCenter.y - ant.y, nCenter.x - ant.x);
                            let directionalStepX = Math.cos(ant.angle) * updatedKinematicVelocity;
                            let directionalStepY = Math.sin(ant.angle) * updatedKinematicVelocity;
                            
                            if (proximateNeighbors > 0) {
                                directionalStepX += (sepVectorX / proximateNeighbors) * 0.12;
                                directionalStepY += (sepVectorY / proximateNeighbors) * 0.12;
                            }
                            ant.x += directionalStepX; ant.y += directionalStepY;
                        } else { ant.x = nCenter.x; ant.y = nCenter.y; ant.row = dest.r; ant.col = dest.c; ant.pathIndex++; }
                    } else {
                        ant.path = null;
                        
                        if (ant.state === 'fetching_egg') {
                            ant.carryingEgg = true; ant.state = 'delivering_egg';
                            if (ant.targetEggCell) {
                                let delivRoute = computeHexGridPath(ant.row, ant.col, ant.targetEggCell.row, ant.targetEggCell.col);
                                if (delivRoute) { ant.path = delivRoute; ant.pathIndex = 0; } 
                                else { ant.targetEggCell.assignedEggCarrierId = null; ant.targetEggCell = null; ant.state = 'idle'; ant.carryingEgg = false; }
                            } else { ant.state = 'idle'; ant.carryingEgg = false; }
                        } else if (ant.state === 'delivering_egg') {
                            if (ant.targetEggCell && (ant.targetEggCell.state === 'worker_nest' || ant.targetEggCell.state === 'warrior_nest') && ant.targetEggCell.eggStatus === 'none') {
                                ant.targetEggCell.eggStatus = 'ready';
                                ant.targetEggCell.eggProgress = 0; ant.targetEggCell.assignedEggCarrierId = null;
                            } else if (ant.targetEggCell) { ant.targetEggCell.assignedEggCarrierId = null; }
                            ant.carryingEgg = false; ant.targetEggCell = null; ant.state = 'idle';
                        } else if (ant.targetFoodRef) {
                            let foodId = ant.targetFoodRef.id;
                            let stillExists = looseFoodItems.some(f => f.id === foodId);
                            if (stillExists && foodStockpile < calculateMaxFoodCapacity()) {
                                looseFoodItems = looseFoodItems.filter(f => f.id !== foodId);
                                ant.carryingFood = true;
                                routeFoodPelletHome(ant);
                            } else {
                                ant.targetFoodRef.assignedAntId = null; ant.targetFoodRef = null; ant.state = 'idle';
                            }
                        } else if (ant.carryingFood) {
                            if (foodStockpile < calculateMaxFoodCapacity()) { foodStockpile = Math.min(calculateMaxFoodCapacity(), foodStockpile + 25); }
                            ant.carryingFood = false; ant.state = 'idle'; updateFoodDisplayHUD();
                        } else if (ant.activeBuildTarget && isAvailableForWork) { ant.state = 'building'; ant.buildProgress = 0; } 
                        else if (ant.activeDigTarget && isAvailableForWork) { ant.state = 'digging'; ant.digProgress = 0; } 
                        else { ant.state = 'idle'; }
                    }
                    return;
                }

                if (ant.state === 'building' && ant.activeBuildTarget) {
                    const bCell = ant.activeBuildTarget;
                    if (bCell.state !== 'blueprint') { ant.activeBuildTarget = null; ant.state = 'idle'; return; }
                    let bCenter = calculateHexUnscaledCenter(bCell.row, bCell.col); ant.angle = Math.atan2(bCenter.y - ant.y, bCenter.x - ant.x);
                    
                    ant.buildProgress++;
                    if (ant.buildProgress >= 300) {
                        bCell.state = bCell.blueprintType; bCell.assignedAntId = null;
                        bCell.eggStatus = 'none'; bCell.eggProgress = 0; bCell.spawnedAntId = null;
                        
                        ant.activeBuildTarget = null;
                        
                        if (bCell.state === 'worker_nest' || bCell.state === 'warrior_nest') {
                            bCell.assignedEggCarrierId = ant.id;
                            ant.targetEggCell = bCell;
                            ant.state = 'fetching_egg';
                            ant.path = null;
                        } else {
                            ant.state = 'idle';
                        }
                        
                        if (ant.pendingGroup) { ant.group = ant.pendingGroup; ant.pendingGroup = null; }
                        refreshDashboardCounters();
                    }
                    return;
                }

                if (ant.state === 'digging' && ant.activeDigTarget) {
                    if (ant.activeDigTarget.state !== 'dirt') { 
                        ant.activeDigTarget = null; ant.state = 'idle'; 
                        if (ant.pendingGroup) { ant.group = ant.pendingGroup; ant.pendingGroup = null; refreshDashboardCounters(); }
                        return; 
                    }
                    let tCenter = calculateHexUnscaledCenter(ant.activeDigTarget.row, ant.activeDigTarget.col); ant.angle = Math.atan2(tCenter.y - ant.y, tCenter.x - ant.x);
                    let coops = antEntitiesList.filter(a => a.state === 'digging' && a.activeDigTarget === ant.activeDigTarget).length;
                    
                    ant.digProgress += 1 * coops;
                    
                    if (ant.digProgress >= 350) { 
                        let brokenTile = ant.activeDigTarget;
                        let companions = antEntitiesList.filter(a => a.state === 'digging' && a.activeDigTarget === brokenTile);

                        if (brokenTile.isMysteryFood) {
                            brokenTile.isMysteryFood = false;
                            let localNodes = getHexNeighbors(brokenTile.row, brokenTile.col);
                            let options = [brokenTile, ...localNodes];
                            
                            options.forEach(n => {
                                hexMatrixGrid[n.row][n.col].state = 'open';
                                markedMiningTasks = markedMiningTasks.filter(t => t.row !== n.row || t.col !== n.col);
                            });
                            
                            let nuggetsCount = Math.floor(Math.random() * 11) + 5; 
                            for(let j=0; j<nuggetsCount; j++) {
                                let pickTile = options[Math.floor(Math.random() * options.length)];
                                let tc = calculateHexUnscaledCenter(pickTile.row, pickTile.col);
                                looseFoodItems.push({
                                    id: 'food_' + Math.floor(Math.random() * 999999) + '_' + j, row: pickTile.row, col: pickTile.col,
                                    x: tc.x + (Math.random() * 8 - 4), y: tc.y + (Math.random() * 8 - 4), assignedAntId: null
                                });
                            }
                        }

                        brokenTile.state = 'open';
                        markedMiningTasks = markedMiningTasks.filter(t => t.row !== brokenTile.row || t.col !== brokenTile.col);

                        companions.forEach(comp => {
                            comp.activeDigTarget = null; comp.state = 'idle'; comp.path = null;
                            if (comp.pendingGroup) { comp.group = comp.pendingGroup; comp.pendingGroup = null; }
                        });

                        refreshDashboardCounters();
                    }
                    return;
                }

                if (ant.state === 'idle') {
                    let centerR = 22, centerC = 22;
                    if (ant.group > 0 && groupRallyPoints[ant.group]) { centerR = groupRallyPoints[ant.group].row; centerC = groupRallyPoints[ant.group].col; }
                    
                    if (Math.random() < 0.04) {
                        let surroundings = getHexNeighbors(ant.row, ant.col).filter(n => evaluateTilePassableState(n.row, n.col) && getHexDistance(n.row, n.col, centerR, centerC) <= 3);
                        if (surroundings.length > 0) {
                            let cell = surroundings[Math.floor(Math.random() * surroundings.length)];
                            ant.path = [{ r: cell.row, c: cell.col }]; ant.pathIndex = 0; ant.state = 'marching';
                        }
                    }
                }
            });
        }

        function routeFoodPelletHome(ant) {
            let storageCells = [];
            for(let r=0; r<totalGridRows; r++) {
                for(let c=0; c<totalGridCols; c++) { if (hexMatrixGrid[r][c].state === 'food_cell') storageCells.push({r, c}); }
            }
            if (storageCells.length > 0) {
                storageCells.sort((a,b) => getHexDistance(ant.row, ant.col, a.r, a.c) - getHexDistance(ant.row, ant.col, b.r, b.c));
                let bestStore = storageCells[0]; let returnRoute = computeHexGridPath(ant.row, ant.col, bestStore.r, bestStore.c);
                if (returnRoute && returnRoute.length > 0) { ant.path = returnRoute; ant.pathIndex = 0; ant.state = 'marching'; }
                else { if (foodStockpile < calculateMaxFoodCapacity()) { foodStockpile = Math.min(calculateMaxFoodCapacity(), foodStockpile + 25); } ant.carryingFood = false; ant.state = 'idle'; updateFoodDisplayHUD(); }
            } else { ant.carryingFood = false; ant.state = 'idle'; }
        }

        function drawSimulationFrameContext() {
            ctx.clearRect(0, 0, viewWidth, viewHeight);

            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) {
                    const cell = hexMatrixGrid[r][c]; const unscaledCenter = calculateHexUnscaledCenter(r, c);
                    const screenX = viewWidth / 2 + (unscaledCenter.x - viewWidth / 2) * currentZoomFactor + viewScrollOffsetX;
                    const screenY = viewHeight / 2 + (unscaledCenter.y - viewHeight / 2) * currentZoomFactor + viewScrollOffsetY;
                    if (screenX < -25 || screenX > viewWidth + 25 || screenY < -25 || screenY > viewHeight + 25) continue;

                    if (cell.state === 'wall') ctx.fillStyle = '#0a0a0d';
                    else if (cell.state === 'dirt') ctx.fillStyle = '#8f633c';
                    else if (cell.state === 'open') ctx.fillStyle = '#2b1a0f';
                    else if (cell.state === 'blueprint') ctx.fillStyle = '#3c3530';
                    else if (cell.state === 'worker_nest') ctx.fillStyle = '#6b4c31';
                    else if (cell.state === 'warrior_nest') ctx.fillStyle = '#592c28';
                    else if (cell.state === 'food_cell') ctx.fillStyle = '#1d3825';
                    else if (cell.state === 'speed_cell') ctx.fillStyle = '#17273a'; // Neon sprint grid style

                    drawHexagonalOutlineShape(screenX, screenY, hexRadius * currentZoomFactor); ctx.fill();

                    if (cell.state === 'dirt') { ctx.strokeStyle = '#734e2e'; ctx.lineWidth = 0.5 * currentZoomFactor; ctx.stroke(); }
                    else if (cell.state === 'blueprint') { ctx.strokeStyle = '#ffa500'; ctx.lineWidth = 0.6 * currentZoomFactor; ctx.stroke(); }
                    else if (cell.state === 'food_cell') { ctx.strokeStyle = '#274d33'; ctx.lineWidth = 0.5 * currentZoomFactor; ctx.stroke(); }
                    else if (cell.state === 'speed_cell') { ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 0.7 * currentZoomFactor; ctx.stroke(); }
                    else { ctx.strokeStyle = '#1a100a'; ctx.lineWidth = 0.4 * currentZoomFactor; ctx.stroke(); }

                    if (cell.state === 'dirt' && cell.isMysteryFood) {
                        ctx.save(); ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                        ctx.font = `bold ${Math.floor(11 * currentZoomFactor)}px 'Orbitron'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('?', screenX, screenY); ctx.restore();
                    }

                    if (['worker_nest', 'warrior_nest', 'food_cell', 'speed_cell', 'blueprint'].includes(cell.state)) {
                        let labelIcon = ''; let typeStr = cell.state === 'blueprint' ? cell.blueprintType : cell.state;
                        if (typeStr === 'worker_nest') labelIcon = '🥚'; if (typeStr === 'warrior_nest') labelIcon = '⚔️'; if (typeStr === 'food_cell') labelIcon = '🍗'; if (typeStr === 'speed_cell') labelIcon = '⚡';
                        
                        ctx.save(); ctx.fillStyle = cell.state === 'blueprint' ? 'rgba(255,255,255,0.3)' : '#ffffff';
                        ctx.font = `${Math.floor(10 * currentZoomFactor)}px Roboto`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(labelIcon, screenX, screenY); ctx.restore();
                    }

                    if ((cell.state === 'worker_nest' || cell.state === 'warrior_nest') && cell.eggStatus === 'ready') {
                        ctx.save(); ctx.fillStyle = '#f5f6f8'; ctx.strokeStyle = '#a6acb5'; ctx.lineWidth = 0.5 * currentZoomFactor;
                        ctx.beginPath(); ctx.ellipse(screenX + 3.5 * currentZoomFactor, screenY + 3.5 * currentZoomFactor, 2.3 * currentZoomFactor, 1.6 * currentZoomFactor, Math.PI / 4, 0, Math.PI * 2);
                        ctx.fill(); ctx.stroke(); ctx.restore();
                    }
                }
            }

            looseFoodItems.forEach(food => {
                let sx = viewWidth / 2 + (food.x - viewWidth / 2) * currentZoomFactor + viewScrollOffsetX;
                let sy = viewHeight / 2 + (food.y - viewHeight / 2) * currentZoomFactor + viewScrollOffsetY;
                if (sx < -10 || sx > viewWidth + 10 || sy < -10 || sy > viewHeight + 10) return;
                ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, 2.5 * currentZoomFactor, 0, Math.PI * 2);
                ctx.fillStyle = '#ffbd59'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 0.5 * currentZoomFactor; ctx.stroke(); ctx.restore();
            });

            markedMiningTasks.forEach(task => {
                let center = calculateHexUnscaledCenter(task.row, task.col);
                let sx = viewWidth / 2 + (center.x - viewWidth / 2) * currentZoomFactor + viewScrollOffsetX;
                let sy = viewHeight / 2 + (center.y - viewHeight / 2) * currentZoomFactor + viewScrollOffsetY;
                ctx.save(); ctx.fillStyle = 'rgba(243, 156, 18, 0.7)';
                drawHexagonalOutlineShape(sx, sy, hexRadius * currentZoomFactor); ctx.fill(); ctx.restore();
            });

            for (let gNum = 1; gNum <= 6; gNum++) {
                let point = groupRallyPoints[gNum];
                if (point) {
                    let center = calculateHexUnscaledCenter(point.row, point.col);
                    let sx = viewWidth / 2 + (center.x - viewWidth / 2) * currentZoomFactor + viewScrollOffsetX;
                    let sy = viewHeight / 2 + (center.y - viewHeight / 2) * currentZoomFactor + viewScrollOffsetY;
                    ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, hexRadius * 1.1 * currentZoomFactor, 0, Math.PI * 2);
                    ctx.strokeStyle = groupColorHexes[gNum]; ctx.lineWidth = 2.5; ctx.stroke();
                    ctx.beginPath(); ctx.arc(sx, sy, 4.5 * currentZoomFactor, 0, Math.PI * 2); ctx.fillStyle = groupColorHexes[gNum]; ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.floor(9 * currentZoomFactor)}px 'Orbitron'`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(gNum, sx, sy); ctx.restore();
                }
            }

            antEntitiesList.forEach(ant => {
                let sx = viewWidth / 2 + (ant.x - viewWidth / 2) * currentZoomFactor + viewScrollOffsetX;
                let sy = viewHeight / 2 + (ant.y - viewHeight / 2) * currentZoomFactor + viewScrollOffsetY;
                if (sx < -25 || sx > viewWidth + 25 || sy < -25 || sy > viewHeight + 25) return;

                ctx.save(); ctx.translate(sx, sy); ctx.rotate(ant.angle);
                let scale = (ant.type === 'queen' ? 1.9 : (ant.type === 'warrior' ? 1.05 : 0.8)) * currentZoomFactor;
                let primaryColor = ant.type === 'queen' ? '#611612' : (ant.type === 'warrior' ? '#b82c23' : '#ca8332');
                let accentColor = ant.type === 'queen' ? '#46100d' : (ant.type === 'warrior' ? '#78150f' : '#a36420');

                ctx.strokeStyle = '#000'; ctx.lineWidth = ant.type === 'queen' ? 1.8 : 0.8;
                [-1.8, -1.3, -0.9, 0.9, 1.3, 1.8].forEach(ang => {
                    ctx.beginPath(); ctx.moveTo(-1 * scale, 0);
                    let jx = -1 * scale + (3.5 * scale) * Math.cos(ang), jy = (3.5 * scale) * Math.sin(ang);
                    ctx.lineTo(jx, jy); ctx.lineTo(jx + (4 * scale) * Math.cos(ang), jy + (4 * scale) * Math.sin(ang)); ctx.stroke();
                });

                ctx.fillStyle = primaryColor; ctx.beginPath(); ctx.arc(-4.5 * scale, 0, 4.2 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = accentColor; ctx.beginPath(); ctx.arc(-0.8 * scale, 0, 2.3 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = ant.type === 'warrior' ? '#ff3b30' : primaryColor; ctx.beginPath(); ctx.arc(2.2 * scale, 0, (ant.type === 'warrior' ? 2.7 : 2.0) * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                if (ant.type === 'warrior') {
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.9 * currentZoomFactor;
                    ctx.beginPath(); ctx.arc(3.4 * scale, 1 * scale, 1.4 * scale, -Math.PI/2, 0); ctx.stroke();
                    ctx.beginPath(); ctx.arc(3.4 * scale, -1 * scale, 1.4 * scale, 0, Math.PI/2); ctx.stroke();
                }

                if (ant.carryingFood) {
                    ctx.fillStyle = '#ffbd59'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.5 * currentZoomFactor;
                    ctx.beginPath(); ctx.arc(4.2 * scale, 0, 1.6 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }

                if (ant.carryingEgg) {
                    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#b0b5bd'; ctx.lineWidth = 0.5 * currentZoomFactor;
                    ctx.beginPath(); ctx.ellipse(4.2 * scale, 0, 1.7 * scale, 1.2 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            });

            renderMinimapHUDOverlay();
        }

        function drawHexagonalOutlineShape(cx, cy, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) { let angle = (Math.PI / 3) * i; ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)); }
            ctx.closePath();
        }

        function renderMinimapHUDOverlay() {
            const mSize = 100; const mx = viewWidth - mSize - 20; const my = 20;
            ctx.fillStyle = 'rgba(10, 12, 17, 0.85)'; ctx.fillRect(mx, my, mSize, mSize);
            ctx.strokeStyle = '#45f3ff'; ctx.lineWidth = 1; ctx.strokeRect(mx, my, mSize, mSize);
            const rStep = mSize / totalGridRows; const cStep = mSize / totalGridCols;
            for (let r = 0; r < totalGridRows; r++) {
                for (let c = 0; c < totalGridCols; c++) {
                    let state = hexMatrixGrid[r][c].state; if (state === 'wall') continue;
                    ctx.fillStyle = state === 'dirt' ? '#6e4a2b' : '#2b1a0f';
                    ctx.fillRect(mx + c * cStep, my + r * rStep, cStep + 0.2, rStep + 0.2);
                }
            }
            let focalGridX = Math.floor(((-viewScrollOffsetX) / currentZoomFactor + viewWidth/2) / (hexRadius * 1.5 * totalGridCols) * mSize);
            let focalGridY = Math.floor(((-viewScrollOffsetY) / currentZoomFactor + viewHeight/2) / (hexRadius * 1.732 * totalGridRows) * mSize);
            ctx.fillStyle = '#ff2a2a'; ctx.fillRect(Math.max(mx, Math.min(mx + mSize - 4, mx + mSize/2 + focalGridX)), Math.max(my, Math.min(my + mSize - 4, my + mSize/2 + focalGridY)), 3, 3);
        }

        function getHexDistance(r1, c1, r2, c2) {
            let x1 = c1, z1 = r1 - (c1 - (c1 & 1)) / 2; let x2 = c2, z2 = r2 - (c2 - (c2 & 1)) / 2;
            return (Math.abs(x1 - x2) + Math.abs(-x1 - z1 + x2 + z2) + Math.abs(z1 - z2)) / 2;
        }

        function runMainSimulationLoop() {
            updateSimulationStateEngine(); drawSimulationFrameContext(); requestAnimationFrame(runMainSimulationLoop);
        }
        window.onload = function() { initializeGameEngine(); };
    </script>
</body>
