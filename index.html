<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raft Framework</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #2b5c8f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
        #hearts-container { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; background: rgba(0, 0, 0, 0.5); padding: 4px 10px; border-radius: 12px; }
        .heart-icon { font-size: 18px; }
        .heart-icon.lost { filter: grayscale(1) brightness(0.6); }
        #hotbar-container { width: 100%; display: flex; justify-content: center; pointer-events: auto; margin-bottom: env(safe-area-inset-bottom, 0px); }
        .hotbar { display: flex; background: rgba(40, 40, 40, 0.85); padding: 6px; border-radius: 12px; border: 2px solid #555; gap: 6px; }
        .slot { width: 44px; height: 44px; background: #1a1a1a; border: 2px solid #777; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; position: relative; }
        .slot.active { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; background: #333; }
        .slot-num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #aaa; }
        #joystick-zone { position: absolute; bottom: 80px; left: 30px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.8); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #status-text { pointer-events: auto; background: rgba(0, 0, 0, 0.6); color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; align-self: center; }
        #action-buttons-stack { position: absolute; bottom: 75px; right: 25px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .hud-btn { width: 55px; height: 55px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.4); color: white; font-weight: bold; font-size: 10px; }
        #hand-button { background: #7f8c8d; border: 3px solid #34495e; display: none; }
        #hammer-button { background: #b38659; border: 3px solid #664d33; }
        #bag-button { background: #8B5A2B; border: 3px solid #5a3a1c; }
        .btn-icon { font-size: 18px; margin-bottom: -2px; }
        #build-controls-overlay { position: absolute; top: 20px; right: 20px; display: none; gap: 12px; pointer-events: auto; }
        .build-btn { width: 50px; height: 50px; border-radius: 50%; border: 3px solid white; color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        #btn-confirm-build { background: #2ecc71; }
        #btn-cancel-build { background: #e74c3c; }
        #inventory-screen { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: rgba(30, 30, 30, 0.95); border: 3px solid #444; border-radius: 16px; padding: 14px; display: none; pointer-events: auto; z-index: 10; }
        #inventory-header { color: white; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        #close-inv-btn { background: #cc3333; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
        #inventory-scroll-container { width: 100%; height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .inv-slot { aspect-ratio: 1; background: #111; border: 2px solid #555; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.4); font-size: 11px; font-weight: bold; }
        .hook-item-icon { width: 24px; height: 24px; background: #7f8c8d; border: 2px solid #bdc3c7; border-radius: 4px; }
        #drag-preview { position: absolute; width: 44px; height: 44px; background: rgba(127, 140, 141, 0.6); border: 2px dashed #bdc3c7; border-radius: 8px; pointer-events: none; display: none; z-index: 100; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="drag-preview"></div>
    <div id="ui-layer">
        <div id="status-text">Slot 1 (Hook Tool Selected)</div>
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="hearts-container">
            <span class="heart-icon" id="heart-0">❤️</span>
            <span class="heart-icon" id="heart-1">❤️</span>
            <span class="heart-icon" id="heart-2">❤️</span>
            <span class="heart-icon" id="heart-3">❤️</span>
        </div>
        <div id="build-controls-overlay">
            <div class="build-btn" id="btn-cancel-build">X</div>
            <div class="build-btn" id="btn-confirm-build">✓</div>
        </div>
        <div id="action-buttons-stack">
            <div class="hud-btn" id="hand-button"><span class="btn-icon">🖐️</span><span>THROW</span></div>
            <div class="hud-btn" id="hammer-button"><span class="btn-icon">🔨</span><span>BUILD</span></div>
            <div class="hud-btn" id="bag-button"><span class="btn-icon">🎒</span><span>BAG</span></div>
        </div>
        <div id="inventory-screen">
            <div id="inventory-header"><span>Inventory (20 Slots)</span><button id="close-inv-btn">X</button></div>
            <div id="inventory-scroll-container"><div id="inventory-grid"></div></div>
        </div>
        <div id="hotbar-container"><div class="hotbar" id="hotbar"></div></div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const dragPreview = document.getElementById('drag-preview');

        const TILE_SIZE = 32; 
        const BASE_SPEED = 3.5;

        let player = { x: 0, y: 0, width: 24, height: 24, color: '#8B5A2B', eyeColor: '#FFFFFF', pupilColor: '#000000', inWater: false, health: 4, lastBiteTime: 0 };
        let shark = { x: 0, y: 0, width: 26, height: 26, speed: 2.2, active: false, state: "HIDDEN", timer: 0, offscreenTimer: 0, targetX: 0, targetY: 0, angle: 0 };
        let buildMode = { active: false, gridX: 0, gridY: 0, touchX: 0, touchY: 0 };
        let hotbarItems = ["hook", null, null, null, null, null, null, null];
        let dragManager = { isDragging: false, fromIndex: -1, touchId: null };
        let hookTool = { state: "IDLE", chargeTimer: 0, chargeColor: "yellow", ringRadius: 0, blinkTimer: 0, x: 0, y: 0, startX: 0, startY: 0, targetX: 0, targetY: 0, speed: 7.0, returnSpeed: 2.0, width: 12, height: 12 };
        let raftGrid = {};

        function getGridKey(gx, gy) { return `${gx},${gy}`; }

        // BUG FIX SUCCESSFUL: Explicitly setups all 4 blocks of the starter 2x2 square around center point
        function initRaft() {
            raftGrid[getGridKey(-1, -1)] = true;
            raftGrid[getGridKey(0, -1)] = true;
            raftGrid[getGridKey(-1, 0)] = true;
            raftGrid[getGridKey(0, 0)] = true;
        }

        let moveVector = { x: 0, y: 0 };
        let activeSlot = 0;
        const hotbarEl = document.getElementById('hotbar');
        const handButton = document.getElementById('hand-button');
        
        function renderHotbarUI() {
            hotbarEl.innerHTML = "";
            for (let i = 0; i < 8; i++) {
                const slot = document.createElement('div');
                slot.className = `slot ${i === activeSlot ? 'active' : ''}`;
                slot.dataset.index = i;
                const num = document.createElement('span');
                num.className = 'slot-num';
                num.innerText = (i + 1);
                slot.appendChild(num);

                if (hotbarItems[i] === "hook") {
                    const icon = document.createElement('div');
                    icon.className = 'hook-item-icon';
                    slot.appendChild(icon);
                }
                
                slot.addEventListener('pointerdown', (e) => {
                    if (hotbarItems[i] !== null) {
                        dragManager.isDragging = true;
                        dragManager.fromIndex = i;
                        dragManager.touchId = e.pointerId;
                        dragPreview.style.display = 'block';
                        dragPreview.style.left = e.clientX + 'px';
                        dragPreview.style.top = e.clientY + 'px';
                        slot.setPointerCapture(e.pointerId);
                    }
                    setActiveSlot(i);
                });

                slot.addEventListener('pointermove', (e) => {
                    if (dragManager.isDragging && dragManager.fromIndex === i && dragManager.touchId === e.pointerId) {
                        dragPreview.style.left = e.clientX + 'px';
                        dragPreview.style.top = e.clientY + 'px';
                    }
                });

                slot.addEventListener('pointerup', (e) => {
                    if (dragManager.isDragging && dragManager.fromIndex === i && dragManager.touchId === e.pointerId) {
                        slot.releasePointerCapture(e.pointerId);
                        dragPreview.style.display = 'none';
                        dragManager.isDragging = false;
                        const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                        const targetSlot = elemBelow ? elemBelow.closest('.slot') : null;
                        if (targetSlot) {
                            const toIndex = parseInt(targetSlot.dataset.index);
                            if (toIndex !== i) {
                                let temp = hotbarItems[toIndex];
                                hotbarItems[toIndex] = hotbarItems[i];
                                hotbarItems[i] = temp;
                                renderHotbarUI();
                                setActiveSlot(activeSlot);
                            }
                        }
                    }
                });
                hotbarEl.appendChild(slot);
            }
            handButton.style.display = (hotbarItems[activeSlot] === "hook") ? "flex" : "none";
        }

        const invGridEl = document.getElementById('inventory-grid');
        for (let j = 0; j < 20; j++) {
            const invSlot = document.createElement('div');
            invSlot.className = 'inv-slot';
            invSlot.innerText = `Box ${j + 1}`;
            invGridEl.appendChild(invSlot);
        }
        // UI Element Selectors
        const bagBtn = document.getElementById('bag-button');
        const hammerBtn = document.getElementById('hammer-button');
        const invScreen = document.getElementById('inventory-screen');
        const closeInvBtn = document.getElementById('close-inv-btn');
        const buildOverlay = document.getElementById('build-controls-overlay');
        const confirmBuildBtn = document.getElementById('btn-confirm-build');
        const cancelBuildBtn = document.getElementById('btn-cancel-build');

        bagBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (buildMode.active) exitBuildMode();
            invScreen.style.display = (invScreen.style.display === 'block') ? 'none' : 'block';
        });

        closeInvBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            invScreen.style.display = 'none';
        });

        hammerBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            invScreen.style.display = 'none'; 
            enterBuildMode();
        });

        // Continuous Blueprint Construction Loop System
        confirmBuildBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            
            // Build the current board piece permanently into dictionary map storage
            raftGrid[getGridKey(buildMode.gridX, buildMode.gridY)] = true;

            // Automatically find and jump preview tile to an adjacent open coordinate slot
            let adjacents = [
                {x: buildMode.gridX + 1, y: buildMode.gridY},
                {x: buildMode.gridX - 1, y: buildMode.gridY},
                {x: buildMode.gridX, y: buildMode.gridY + 1},
                {x: buildMode.gridX, y: buildMode.gridY - 1}
            ];

            for (let i = 0; i < adjacents.length; i++) {
                let key = getGridKey(adjacents[i].x, adjacents[i].y);
                if (!raftGrid[key]) { // Spot is completely vacant and free
                    buildMode.gridX = adjacents[i].x;
                    buildMode.gridY = adjacents[i].y;
                    break;
                }
            }

            statusText.innerText = "Piece Built! Continuous build loop active...";
        });

        cancelBuildBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            exitBuildMode();
        });

        function enterBuildMode() {
            buildMode.active = true;
            buildOverlay.style.display = 'flex';
            buildMode.touchX = canvas.width / 2;
            buildMode.touchY = canvas.height / 2;
            statusText.innerText = "Build Mode: Drag block & click checkmark to expand";
        }

        function exitBuildMode() {
            buildMode.active = false;
            buildOverlay.style.display = 'none';
            statusText.innerText = `Active Slot: ${activeSlot + 1} (${hotbarItems[activeSlot] === 'hook' ? 'Hook Selected' : 'Empty Framework'})`;
        }

        window.addEventListener('pointermove', (e) => {
            if (!buildMode.active) return;
            buildMode.touchX = e.clientX;
            buildMode.touchY = e.clientY;
        });

        function setActiveSlot(index) {
            activeSlot = index;
            document.querySelectorAll('.slot').forEach((s, idx) => {
                if (idx === index) s.classList.add('active');
                else s.classList.remove('active');
            });
            
            if (hotbarItems[activeSlot] === "hook") {
                handButton.style.display = "flex";
                statusText.innerText = `Active Slot: ${index + 1} (Hook Selected)`;
            } else {
                handButton.style.display = "none";
                statusText.innerText = `Active Slot: ${index + 1} (Empty Framework)`;
            }
        }

        // --- Hook Throwing Charge Input Controllers Interface ---
        handButton.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (hookTool.state === "IDLE") {
                hookTool.state = "CHARGING";
                hookTool.chargeTimer = 0;
                hookTool.chargeColor = "yellow";
                hookTool.ringRadius = 15;
                handButton.setPointerCapture(e.pointerId);
            }
        });

        handButton.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            if (hookTool.state === "CHARGING") {
                handButton.releasePointerCapture(e.pointerId);
                
                hookTool.state = "THROWN";
                hookTool.x = player.x;
                hookTool.y = player.y;
                hookTool.startX = player.x;
                hookTool.startY = player.y;

                let throwDistance = hookTool.ringRadius * 3.5; 
                let angle = Math.atan2(moveVector.y, moveVector.x);
                if (moveVector.x === 0 && moveVector.y === 0) {
                    angle = -Math.PI / 2; 
                }

                hookTool.targetX = player.x + Math.cos(angle) * throwDistance;
                hookTool.targetY = player.y + Math.sin(angle) * throwDistance;
            }
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        const maxDrag = 45; 

        joystickZone.addEventListener('pointerdown', (e) => {
            joystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickStart = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            joystickZone.setPointerCapture(e.pointerId);
            handleJoystickMove(e);
        });

        joystickZone.addEventListener('pointermove', (e) => {
            if (!joystickActive) return;
            handleJoystickMove(e);
        });

        function handleJoystickMove(e) {
            let dx = e.clientX - joystickStart.x;
            let dy = e.clientY - joystickStart.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxDrag) {
                dx = (dx / distance) * maxDrag;
                dy = (dy / distance) * maxDrag;
                distance = maxDrag;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxDrag;
            moveVector.y = dy / maxDrag;
        }

        function resetJoystick() {
            joystickActive = false;
            joystickStick.style.transform = `translate(0px, 0px)`;
            moveVector.x = 0;
            moveVector.y = 0;
        }

        joystickZone.addEventListener('pointerup', resetJoystick);
        joystickZone.addEventListener('pointercancel', resetJoystick);
        function isStandingOnRaft(x, y) {
            const gx = Math.floor((x + player.width / 2) / TILE_SIZE);
            const gy = Math.floor((y + player.height / 2) / TILE_SIZE);
            return raftGrid[getGridKey(gx, gy)] === true;
        }

        function getOffscreenPosition() {
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnDistance = Math.max(canvas.width, canvas.height) / 1.3 + 120;
            return {
                x: player.x + Math.cos(spawnAngle) * spawnDistance,
                y: player.y + Math.sin(spawnAngle) * spawnDistance
            };
        }

        function syncHeartsHUD() {
            for (let i = 0; i < 4; i++) {
                const heartEl = document.getElementById(`heart-${i}`);
                if (heartEl) {
                    if (i < player.health) {
                        heartEl.classList.remove('lost');
                    } else {
                        heartEl.classList.add('lost');
                    }
                }
            }
        }

        function update() {
            player.inWater = !isStandingOnRaft(player.x, player.y);
            let currentSpeed = player.inWater ? (BASE_SPEED / 4) : BASE_SPEED;

            player.x += moveVector.x * currentSpeed;
            player.y += moveVector.y * currentSpeed;

            // --- Hook Tool Mechanics State Tracker Animation ---
            if (hookTool.state === "CHARGING") {
                hookTool.chargeTimer++;
                if (hookTool.ringRadius < 85) {
                    hookTool.ringRadius += 0.8;
                }
                if (hookTool.chargeTimer > 70) {
                    hookTool.chargeColor = "green";
                    hookTool.blinkTimer++;
                }
            }

            if (hookTool.state === "THROWN") {
                let dx = hookTool.targetX - hookTool.x;
                let dy = hookTool.targetY - hookTool.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 6) {
                    let angle = Math.atan2(dy, dx);
                    hookTool.x += Math.cos(angle) * hookTool.speed;
                    hookTool.y += Math.sin(angle) * hookTool.speed;
                } else {
                    hookTool.state = "RETURNING";
                }
            }

            if (hookTool.state === "RETURNING") {
                let dx = player.x - hookTool.x;
                let dy = player.y - hookTool.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 10) {
                    let angle = Math.atan2(dy, dx);
                    hookTool.x += Math.cos(angle) * hookTool.returnSpeed;
                    hookTool.y += Math.sin(angle) * hookTool.returnSpeed;
                } else {
                    hookTool.state = "IDLE";
                }
            }

            // --- Shark Smart State Machine Manager ---
            if (player.inWater) {
                shark.targetX = player.x;
                shark.targetY = player.y;

                if (shark.state === "HIDDEN" || shark.state === "RETREATING") {
                    shark.state = "WAITING";
                    shark.timer = 0; 
                }

                if (shark.state === "WAITING") {
                    shark.timer++;
                    if (shark.timer >= 180) {
                        if (!shark.active) {
                            const spawnPos = getOffscreenPosition();
                            shark.x = spawnPos.x;
                            shark.y = spawnPos.y;
                            shark.active = true;
                        }
                        shark.state = "CHASING";
                    }
                }
            } else {
                if (shark.state === "WAITING") {
                    shark.state = "HIDDEN";
                }

                if (shark.state === "CHASING") {
                    shark.state = "RETREATING";
                    const escapePoint = getOffscreenPosition();
                    shark.targetX = escapePoint.x;
                    shark.targetY = escapePoint.y;
                }
            }

            if (shark.state === "CHASING" || shark.state === "RETREATING") {
                let dx = shark.targetX - shark.x;
                let dy = shark.targetY - shark.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                shark.angle = Math.atan2(dy, dx);

                let currentSharkSpeed = (shark.state === "RETREATING") ? (shark.speed * 1.5) : shark.speed;

                if (dist > 2) {
                    shark.x += Math.cos(shark.angle) * currentSharkSpeed;
                    shark.y += Math.sin(shark.angle) * currentSharkSpeed;
                }

                // --- SHARK ATTACK / BITE LOOP ---
                if (shark.state === "CHASING" && dist < 18) {
                    let currentTime = Date.now();
                    if (currentTime - player.lastBiteTime >= 1000) { // Every 1 whole second
                        if (player.health > 0) {
                            player.health--;
                            syncHeartsHUD();
                        }
                        player.lastBiteTime = currentTime;
                    }
                }
            }

            let sOffsetX = canvas.width / 2 - player.x;
            let sOffsetY = canvas.height / 2 - player.y;
            let sharkRenderX = shark.x + sOffsetX;
            let sharkRenderY = shark.y + sOffsetY;
            let isOffscreen = (sharkRenderX < -120 || sharkRenderX > canvas.width + 120 || sharkRenderY < -120 || sharkRenderY > canvas.height + 120);

            if (isOffscreen && shark.active) {
                shark.offscreenTimer++;
                if (shark.offscreenTimer >= 180) {
                    shark.state = "HIDDEN";
                    shark.active = false;
                    shark.offscreenTimer = 0;
                }
            } else {
                shark.offscreenTimer = 0; 
            }

            if (buildMode.active) {
                const worldTouchX = buildMode.touchX - (canvas.width / 2 - player.x);
                const worldTouchY = buildMode.touchY - (canvas.height / 2 - player.y);
                
                if (Math.abs(buildMode.touchX - canvas.width/2) > 40 || Math.abs(buildMode.touchY - canvas.height/2) > 40) {
                    buildMode.gridX = Math.floor(worldTouchX / TILE_SIZE);
                    buildMode.gridY = Math.floor(worldTouchY / TILE_SIZE);
                }
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const offsetX = canvas.width / 2 - player.x;
            const offsetY = canvas.height / 2 - player.y;

            // 1. SHARK UNDERWATER LAYER
            if (shark.active) {
                const sx = shark.x + offsetX;
                const sy = shark.y + offsetY;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(shark.angle);
                ctx.fillStyle = (shark.state === "CHASING") ? '#b53333' : '#4a6572'; 
                ctx.beginPath();
                ctx.moveTo(-16, 0);
                ctx.lineTo(0, -10);
                ctx.lineTo(16, 0);
                ctx.lineTo(0, 10);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(6, -5, 2, 2);
                ctx.fillRect(6, 3, 2, 2);
                ctx.restore();
            }

            // 2. ROPE THROWING ATTACHMENT LINE
            if (hookTool.state === "THROWN" || hookTool.state === "RETURNING") {
                ctx.strokeStyle = '#d7ccc8'; 
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, canvas.height / 2); 
                ctx.lineTo(hookTool.x + offsetX, hookTool.y + offsetY);
                ctx.stroke();
            }

            // 3. RAFT TILE BLOCKS RENDER LAYER
            ctx.fillStyle = '#b38659'; 
            ctx.strokeStyle = '#664d33'; 
            ctx.lineWidth = 2;

            for (let key in raftGrid) {
                const coords = key.split(',');
                const gx = parseInt(coords[0]);
                const gy = parseInt(coords[1]);

                const rx = gx * TILE_SIZE + offsetX;
                const ry = gy * TILE_SIZE + offsetY;

                if (rx + TILE_SIZE > 0 && rx < canvas.width && ry + TILE_SIZE > 0 && ry < canvas.height) {
                    ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                    ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.fillRect(rx + 2, ry + 4, TILE_SIZE - 4, 6);
                    ctx.fillRect(rx + 2, ry + 18, TILE_SIZE - 4, 6);
                    ctx.fillStyle = '#b38659'; 
                }
            }

            // 4. BUILD PREVIEW INDICATOR SYSTEM
            if (buildMode.active) {
                const bx = buildMode.gridX * TILE_SIZE + offsetX;
                const by = buildMode.gridY * TILE_SIZE + offsetY;
                ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 3;
                ctx.fillRect(bx, by, TILE_SIZE, TILE_SIZE);
                ctx.strokeRect(bx, by, TILE_SIZE, TILE_SIZE);
            }

            // 5. SMALL GRAY HOOK BOX TOOL PROFILE OBJECT
            if (hookTool.state === "THROWN" || hookTool.state === "RETURNING") {
                const hx = hookTool.x + offsetX - hookTool.width / 2;
                const hy = hookTool.y + offsetY - hookTool.height / 2;
                ctx.fillStyle = '#7f8c8d'; 
                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 1.5;
                ctx.fillRect(hx, hy, hookTool.width, hookTool.height);
                ctx.strokeRect(hx, hy, hookTool.width, hookTool.height);
            }

            // 6. CHARACTER RENDER PLAYER LAYER
            const px = canvas.width / 2 - player.width / 2;
            const py = canvas.height / 2 - player.height / 2;

            ctx.fillStyle = player.color;
            ctx.fillRect(px, py, player.width, player.height);
            ctx.strokeStyle = '#5a3a1c';
            ctx.lineWidth = 2;
            ctx.strokeRect(px, py, player.width, player.height);

            if (player.inWater) {
                ctx.fillStyle = 'rgba(43, 92, 143, 0.75)';
                ctx.fillRect(px - 1, py + player.height / 2, player.width + 2, player.height / 2 + 1);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2 + 6, 16 + Math.sin(Date.now() * 0.005) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // CHARGING RING RENDERING LOOPS
            if (hookTool.state === "CHARGING") {
                if (hookTool.chargeColor === "yellow" || (hookTool.chargeColor === "green" && Math.floor(hookTool.blinkTimer / 6) % 2 === 0)) {
                    ctx.strokeStyle = hookTool.chargeColor === "yellow" ? '#f1c40f' : '#2ecc71';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, hookTool.ringRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = player.eyeColor;
            let eyeOffsetX = 0;
            let eyeOffsetY = 0;
            if (Math.abs(moveVector.x) > 0.2) eyeOffsetX = Math.sign(moveVector.x) * 2;
            if (Math.abs(moveVector.y) > 0.2) eyeOffsetY = Math.sign(moveVector.y) * 2;
            let waterEyeYShift = player.inWater ? 1 : 0;

            ctx.fillRect(px + 4 + eyeOffsetX, py + 6 + eyeOffsetY + waterEyeYShift, 5, 5);
            ctx.fillRect(px + 13 + eyeOffsetX, py + 6 + eyeOffsetY + waterEyeYShift, 5, 5);

            ctx.fillStyle = player.pupilColor;
            ctx.fillRect(px + 6 + eyeOffsetX, py + 8 + eyeOffsetY + waterEyeYShift, 2, 2);
            ctx.fillRect(px + 15 + eyeOffsetX, py + 8 + eyeOffsetY + waterEyeYShift, 2, 2);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize parameter matrices
        initRaft();
        renderHotbarUI();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
